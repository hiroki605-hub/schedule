<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロゴ投票</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--fg:#1a1a1a;--card:#fff;--line:#d9d5cb;--acc:#b3261e;--mut:#6b675e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--fg:#f1eee8;--card:#fff;--line:#3a372f;--acc:#ff6b5e;--mut:#a8a396}}
:root[data-theme="dark"]{--bg:#161513;--fg:#f1eee8;--card:#fff;--line:#3a372f;--acc:#ff6b5e;--mut:#a8a396}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.3rem;margin:.2em 0}p.s{color:var(--mut);margin:.2em 0 1em;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.c{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;color:#1a1a1a}
.c img{width:100%;display:block;border-radius:6px}.c.sel{border-color:var(--acc)}
.c b{position:absolute;top:6px;left:8px;background:#1a1a1a;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;font-weight:700}
button:disabled{opacity:.4}
.msg{text-align:center;padding:40px 10px}
.res{margin-top:28px;background:var(--card);color:#1a1a1a;border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row img{width:44px;height:44px;border-radius:4px}
.bar{flex:1;background:#eee;border-radius:6px;height:22px;overflow:hidden}.bar i{display:block;height:100%;background:#b3261e;width:0;transition:width .4s}
.n{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
</style></head><body><main>

YRhWGIfTJrSgTuRzNMlSzDXZUA273bqI5qHgAAAAAAAA=="];const L="ABCDEFG".split("");
const app=document.getElementById("app"),resEl=document.getElementById("res");
let sel=null,voted=false;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const api=()=>DB_URL.replace(/\/$/,"")+"/votes.json";
function render(){
 if(!DB_URL){app.innerHTML='<div class="msg">設定が未完了です(DB_URLが空です)</div>';return}
 if(voted){app.innerHTML='<div class="msg"><h2>投票ありがとうございました 🙏</h2></div>';return}
 app.innerHTML='<div class="grid">'+IMGS.map((s,i)=>`<div class="c${sel===i?' sel':''}" data-i="${i}"><b>${L[i]}</b><img src="${s}" alt="案${L[i]}"></div>`).join('')+'</div><button id="go" '+(sel===null?'disabled':'')+'>この案に投票する</button>';
 app.querySelectorAll(".c").forEach(e=>e.onclick=()=>{sel=+e.dataset.i;render()});
 document.getElementById("go").onclick=submit;
}
async function submit(){
 const b=document.getElementById("go");b.disabled=true;
 try{
  const r=await fetch(api(),{method:"POST",body:JSON.stringify({c:sel,t:Date.now()})});
  if(!r.ok)throw 0;ls("voted","1");voted=true;render();
 }catch(e){b.disabled=false;alert("投票に失敗しました。もう一度お試しください。")}
}
async function poll(){
 try{
  const o=await (await fetch(api())).json()||{};
  const c=Array(IMGS.length).fill(0);Object.values(o).forEach(v=>{if(c[v.c]!==undefined)c[v.c]++});
  const tot=c.reduce((a,b)=>a+b,0),max=Math.max(1,...c);
  resEl.innerHTML='<div class="res"><b>📊 リアルタイム結果</b> 合計 '+tot+' 票'+IMGS.map((s,i)=>`<div class="row"><b>${L[i]}</b><img src="${s}"><div class="bar"><i style="width:${c[i]/max*100}%"></i></div><span class="n">${c[i]}票${tot?' ('+Math.round(c[i]/tot*100)+'%)':''}</span></div>`).join('')+'</div>';
 }catch(e){}
}
voted=ls("voted")==="1";
if(location.hash==="#results"){document.getElementById("app").style.display="none";if(DB_URL){poll();setInterval(poll,3000)}}
else render();
</script></body></html>
