<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集団行動 振り返りひろば</title>

<!-- ▼▼▼ ここから設定 ▼▼▼ ------------------------------------------------
  1) Firebaseコンソール(https://console.firebase.google.com/)でプロジェクトを作成
  2) 左メニュー「構築」→「Realtime Database」→ 作成（ロケーションは asia-southeast1 などでOK）
     → 開始時のルールは「テストモードで開始」を選ぶ
  3) 左上の歯車アイコン →「プロジェクトの設定」→ 下の方の「マイアプリ」→ ウェブアプリを追加(</>アイコン)
  4) 表示された firebaseConfig の中身を下の FIREBASE_CONFIG にそのままコピペする
  5) 30日後にテストモードの権限が切れるので、Realtime Database →「ルール」タブで下記に書き換えて公開する
     { "rules": { ".read": true, ".write": true } }
     （生徒が全員ログイン不要で使えるようにするための設定。学校の実技の振り返りデータなので
       このレベルの公開設定でも実用上は問題ないと考えられますが、個人情報の取り扱いには
       十分注意してください）
------------------------------------------------------------------------- -->

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --navy:#152343;
    --navy-2:#22355e;
    --paper:#F5F3EC;
    --line:#DFE3EA;
    --yellow:#F2B705;
    --yellow-deep:#C98F00;
    --red:#C1442D;
    --green:#3D7A5C;
    --text:#152343;
    --muted:#6A7180;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    font-family:'Noto Sans JP', sans-serif;
    background:var(--paper);
    color:var(--text);
    min-height:100%;
    padding-bottom:60px;
  }
  .display{font-family:'Zen Kaku Gothic New', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ===== lane-line signature ===== */
  .lanes{
    height:14px;
    background:repeating-linear-gradient(
      -35deg,
      var(--yellow) 0px, var(--yellow) 18px,
      transparent 18px, transparent 40px
    );
    opacity:.9;
  }
  .lanes.thin{height:6px;}


  header.top{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 18px;
  }
  header.top .eyebrow{
    font-size:11px; letter-spacing:.22em; color:var(--yellow);
    font-weight:700; margin-bottom:4px;
  }
  header.top h1{
    font-weight:900; font-size:22px; margin:0 0 2px;
  }
  header.top p{margin:0;color:#B9C2D6;font-size:13px;}

  .modeswitch{
    display:flex; gap:8px; padding:14px 20px 0;
    max-width:920px; margin:0 auto;
  }
  .modeswitch button{
    flex:1; border:2px solid var(--navy); background:#fff; color:var(--navy);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:700; font-size:14px;
    padding:10px 8px; border-radius:10px; cursor:pointer;
  }
  .modeswitch button.active{background:var(--navy); color:#fff;}

  main{max-width:920px; margin:0 auto; padding:16px 20px 40px;}

  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tabs button{
    border:none; background:#fff; color:var(--navy-2);
    padding:8px 14px; border-radius:999px; font-weight:700; font-size:12.5px;
    cursor:pointer; border:1.5px solid var(--line);
  }
  .tabs button.active{background:var(--yellow); border-color:var(--yellow-deep); color:var(--navy);}

  .card{
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .card h2{margin:0 0 4px; font-size:16px; font-family:'Zen Kaku Gothic New';}
  .card .sub{color:var(--muted); font-size:12.5px; margin:0 0 14px;}

  label.field-label{display:block; font-weight:700; font-size:13px; margin-bottom:6px; color:var(--navy-2);}
  select, textarea, input[type=text]{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-family:inherit; font-size:14px; background:#fff; color:var(--text);
  }
  textarea{resize:vertical; min-height:70px;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--navy); color:#fff; border:none; padding:10px 18px;
    border-radius:10px; font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .btn.yellow{background:var(--yellow); color:var(--navy);}
  .btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.danger{background:#fff; color:var(--red); border:1.5px solid var(--red);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.sm{padding:6px 12px; font-size:12px;}

  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:140px;}

  /* rating cones */
  .rating-block{margin-bottom:18px;}
  .rating-block .q-label{font-weight:700; font-size:14px;}
  .rating-block .q-hint{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .cones{display:flex; gap:8px;}
  .cone{
    flex:1; text-align:center; padding:10px 0; border-radius:10px;
    border:2px solid var(--line); font-weight:700; font-family:'JetBrains Mono';
    cursor:pointer; user-select:none; background:#fff; color:var(--navy-2);
  }
  .cone.selected{background:var(--yellow); border-color:var(--yellow-deep); color:var(--navy);}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th, td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .score-pill{
    display:inline-block; padding:2px 8px; border-radius:999px; font-weight:700;
    font-family:'JetBrains Mono'; font-size:12px;
  }
  .score-pill.s5{background:#e3f3ea; color:var(--green);}
  .score-pill.s4{background:#eef6e6; color:#4c7a2e;}
  .score-pill.s3{background:#fdf3d6; color:var(--yellow-deep);}
  .score-pill.s2{background:#fbe6dd; color:#b25a2a;}
  .score-pill.s1{background:#fbe3df; color:var(--red);}
  .pending{color:var(--muted); font-style:italic;}

  .empty{
    text-align:center; padding:34px 16px; color:var(--muted);
  }
  .empty .big{font-size:34px;}

  .item-row{
    display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; background:var(--paper);
    padding:10px; border-radius:10px; border:1px solid var(--line);
  }
  .item-row .fields{flex:1; display:flex; flex-direction:column; gap:6px;}
  .item-row button{flex-shrink:0;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; z-index:50; box-shadow:0 6px 18px rgba(0,0,0,.2);
  }

  .tpl-list{display:flex; flex-direction:column; gap:8px;}
  .tpl-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
  }
  .tpl-item:hover{border-color:var(--yellow-deep);}
  .tpl-item .name{font-weight:700; font-family:'Zen Kaku Gothic New';}
  .tpl-item .meta{font-size:11.5px; color:var(--muted);}

  .done-screen{text-align:center; padding:50px 16px;}
  .done-screen .stamp{
    display:inline-block; border:4px solid var(--navy); color:var(--navy);
    font-family:'Zen Kaku Gothic New'; font-weight:900; font-size:20px;
    padding:14px 28px; border-radius:14px; transform:rotate(-3deg);
    margin-bottom:14px;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(21,35,67,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-card{
    background:#fff; border-radius:16px; padding:22px; width:100%; max-width:360px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-card h3{margin:0 0 6px; font-family:'Zen Kaku Gothic New'; font-size:16px;}
  .modal-card .sub{color:var(--muted); font-size:12.5px; margin:0 0 14px;}
  .modal-card input{margin-bottom:0;}
  @media (max-width:480px){
    .cones{flex-wrap:wrap;}
    .cone{min-width:18%;}
    table{font-size:11px;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  const $app = document.getElementById('app');
  const CLASS_NAMES = ['1組','2組','3組'];

  let state = {
    mode: 'student', // 'student' | 'teacher'
    teacherTab: 'templates', // templates | roster | responses
    config: null,
    loading: true,
    // student flow
    s_templateId: null,
    s_class: null,
    s_entry: null,
    s_ratings: {},
    s_reflections: {},
    s_submitting: false,
    s_done: false,
    teacherUnlocked: false,
    modal: null,
    // teacher: template editor
    editingTemplate: null, // object being edited, or null
    // teacher: roster editor
    rosterClass: '1組',
    rosterDraft: '',
    // teacher: responses view
    r_templateId: null,
    r_classFilter: 'all',
    r_responses: [],
    r_loading: false,
    r_grading: {}, // responseId -> true while grading
  };

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function defaultConfig(){
    return {
      teacherPassword: null,
      templates: [{
        id: uid(),
        name: 'ラジオ体操',
        createdAt: Date.now(),
        ratingGroups: [
          {
            id:'taido', name:'主体的に取り組む態度',
            items:[
              {id:'r5', label:'意欲', hint:'きびきびとした動作で、全力で取り組めた'},
            ]
          },
          {
            id:'shikou', name:'思考・判断',
            items:[
              {id:'r1', label:'ラジオ体操', hint:'指先まで伸ばし、大きくキレのある動きができた'},
              {id:'r2', label:'方向転換', hint:'かかとを軸に、素早く正確な角度で回れた'},
              {id:'r3', label:'規律', hint:'周りの音や動きを聞き、タイミングを合わせて動けた'},
              {id:'r4', label:'姿勢', hint:'指示を待つ間も、正しい姿勢（気をつけ）を維持できた'},
            ]
          }
        ],
        reflections: [
          {id:'f1', label:'感想①：今日の練習で「特に意識したこと」や「うまくできた動き」を詳しく', hint:'腕の角度、かかとの軸、列を揃える意識など、具体的に書こう'},
          {id:'f2', label:'感想②：集団としてより美しく動くための「これからの課題」や「目標」を', hint:'次の授業で意識したいポイントや、周りを見て気づいたことを書こう'},
        ]
      }],
      rosters: {'1組':[], '2組':[], '3組':[]}
    };
  }

  // 旧バージョン（フラットな ratings 配列）のテンプレートを新しい ratingGroups 構造へ移行
  function migrateTemplate(t){
    if(!t.ratingGroups){
      t.ratingGroups = [
        {id:'taido', name:'主体的に取り組む態度', items:[]},
        {id:'shikou', name:'思考・判断', items: t.ratings || []},
      ];
      delete t.ratings;
    }
    return t;
  }

  let db = null; // firebase.initializeApp後にセット

  async function loadConfig(){
    try{
      db = firebase.database();
      const snap = await db.ref('config').once('value');
      const val = snap.exists() ? snap.val() : null;
      state.config = val || defaultConfig();
      if(!val){ await saveConfig(); }
      if(state.config.teacherPassword === undefined) state.config.teacherPassword = null;
      if(!state.config.rosters) state.config.rosters = {'1組':[], '2組':[], '3組':[]};
      if(!state.config.templates) state.config.templates = [];
      state.config.templates.forEach(migrateTemplate);
    }catch(e){
      state.config = defaultConfig();
      try{ await saveConfig(); }catch(e2){ /* Firebaseに書き込めない場合はメモリ上のみで続行 */ }
    }
  }
  async function saveConfig(){
    await db.ref('config').set(state.config);
  }

  async function loadResponses(templateId){
    try{
      const snap = await db.ref('responses/'+templateId).once('value');
      const val = snap.exists() ? snap.val() : null;
      return val ? Object.values(val) : [];
    }catch(e){ return []; }
  }
  async function saveResponses(templateId, arr){
    const obj = {};
    arr.forEach(r=>{ obj[r.id] = r; });
    await db.ref('responses/'+templateId).set(obj);
  }
  // 生徒の送信は自分のキーだけを書き込む（他の生徒の回答と競合しない）
  async function pushOneResponse(templateId, resp){
    await db.ref('responses/'+templateId+'/'+resp.id).set(resp);
  }
  // AI採点結果も対象の回答だけをピンポイントで更新する
  async function saveAiScoreOnly(templateId, responseId, aiScore){
    await db.ref('responses/'+templateId+'/'+responseId+'/aiScore').set(aiScore);
  }

  // ==== 回答一覧のリアルタイム購読（Firebaseのプッシュ更新） ====
  let responsesRef = null;
  function stopRealtimeResponses(){
    if(responsesRef){ responsesRef.off(); responsesRef = null; }
  }
  function startRealtimeResponses(templateId){
    stopRealtimeResponses();
    responsesRef = db.ref('responses/'+templateId);
    responsesRef.on('value', (snap)=>{
      if(Object.keys(state.r_grading).length>0) return; // 採点中は上書きしない
      const val = snap.val();
      state.r_responses = val ? Object.values(val) : [];
      if(state.mode==='teacher' && state.teacherTab==='responses') render();
    });
  }

  let toastTimer=null;
  function toast(msg){
    let el = document.querySelector('.toast');
    if(el) el.remove();
    el = document.createElement('div');
    el.className='toast';
    el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.remove(), 2400);
  }

  function render(){
    if(state.loading){
      $app.innerHTML = `<div class="empty" style="padding-top:80px;">読み込み中…</div>`;
      return;
    }
    $app.innerHTML = `
      <header class="top">
        <div class="eyebrow">TAIIKU · シュウダンコウドウ</div>
        <h1>集団行動 振り返りひろば</h1>
        <p>キレ・揃える意識・正しい姿勢 ── 今日の動きを、自分の言葉でふり返る</p>
      </header>
      <div class="lanes"></div>
      <div class="modeswitch">
        <button class="${state.mode==='student'?'active':''}" data-act="mode" data-val="student">生徒として回答</button>
        <button class="${state.mode==='teacher'?'active':''}" data-act="mode" data-val="teacher">${state.teacherUnlocked?'先生モード':'🔒 先生モード'}</button>
      </div>
      <main id="main"></main>
      ${renderModal()}
    `;
    const main = document.getElementById('main');
    main.innerHTML = state.mode==='student' ? renderStudent() : renderTeacher();
    bindEvents();
    const firstModalInput = document.querySelector('.modal-card input');
    if(firstModalInput){
      firstModalInput.focus();
      document.querySelectorAll('.modal-card input').forEach(inp=>{
        inp.addEventListener('keydown', (e)=>{
          if(e.key==='Enter'){
            const btn = document.getElementById('modalSubmitBtn');
            if(btn) btn.click();
          }
        });
      });
    }
  }

  function renderModal(){
    if(!state.modal) return '';
    const m = state.modal;
    if(m.kind === 'teacherSetup'){
      return `<div class="modal-overlay">
        <div class="modal-card">
          <h3>先生モードの初期設定</h3>
          <p class="sub">先生モード用のパスコードを決めてください（4文字以上）。次回からこのパスコードで入れます。</p>
          <input type="password" id="modalInput1" placeholder="パスコード（4文字以上）">
          <div class="row" style="margin-top:14px;">
            <button class="btn ghost" data-act="modal_cancel">キャンセル</button>
            <button class="btn yellow" id="modalSubmitBtn" data-act="modal_submit_setup">設定して入る</button>
          </div>
        </div>
      </div>`;
    }
    if(m.kind === 'teacherLogin'){
      return `<div class="modal-overlay">
        <div class="modal-card">
          <h3>先生モードのパスコード</h3>
          <p class="sub">設定したパスコードを入力してください</p>
          <input type="password" id="modalInput1" placeholder="パスコード">
          <div class="row" style="margin-top:14px;">
            <button class="btn ghost" data-act="modal_cancel">キャンセル</button>
            <button class="btn yellow" id="modalSubmitBtn" data-act="modal_submit_login">入る</button>
          </div>
        </div>
      </div>`;
    }
    if(m.kind === 'changePass'){
      return `<div class="modal-overlay">
        <div class="modal-card">
          <h3>パスコードの変更</h3>
          <p class="sub">現在のパスコードと、新しいパスコード（4文字以上）を入力してください</p>
          <input type="password" id="modalInput1" placeholder="現在のパスコード" style="margin-bottom:8px;">
          <input type="password" id="modalInput2" placeholder="新しいパスコード（4文字以上）">
          <div class="row" style="margin-top:14px;">
            <button class="btn ghost" data-act="modal_cancel">キャンセル</button>
            <button class="btn yellow" id="modalSubmitBtn" data-act="modal_submit_changepass">変更する</button>
          </div>
        </div>
      </div>`;
    }
    if(m.kind === 'confirmDeleteTemplate'){
      return `<div class="modal-overlay">
        <div class="modal-card">
          <h3>種目を削除しますか？</h3>
          <p class="sub">「${esc(m.name)}」を削除します。回答データは残りますが、種目一覧からは消えます。</p>
          <div class="row" style="margin-top:14px;">
            <button class="btn ghost" data-act="modal_cancel">キャンセル</button>
            <button class="btn danger" data-act="modal_confirm_delete_tpl" data-id="${m.id}">削除する</button>
          </div>
        </div>
      </div>`;
    }
    return '';
  }

  // ================= STUDENT MODE =================
  function renderStudent(){
    if(state.s_done){
      return `
        <div class="card done-screen">
          <div class="stamp">送信完了</div>
          <p style="color:var(--muted);">お疲れさま！次の人に交代してね。</p>
          <button class="btn yellow" data-act="s_reset_next">次の人へわたす</button>
        </div>
      `;
    }
    const tpl = state.config.templates.find(t=>t.id===state.s_templateId);

    let html = `<div class="card">
      <h2>① 種目を選ぶ</h2>
      <p class="sub">今日の授業で取り組んだ種目を選んでください</p>
      <select data-act="s_pick_template">
        <option value="">-- 選択 --</option>
        ${state.config.templates.map(t=>`<option value="${t.id}" ${t.id===state.s_templateId?'selected':''}>${esc(t.name)}</option>`).join('')}
      </select>
    </div>`;

    if(!tpl) return html;

    const roster = state.config.rosters[state.s_class] || [];

    html += `<div class="card">
      <h2>② クラス・出席番号</h2>
      <div class="row">
        <div>
          <label class="field-label">クラス</label>
          <select data-act="s_pick_class">
            <option value="">-- 選択 --</option>
            ${CLASS_NAMES.map(c=>`<option value="${c}" ${c===state.s_class?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="field-label">出席番号・名前</label>
          <select data-act="s_pick_entry" ${!state.s_class?'disabled':''}>
            <option value="">-- 選択 --</option>
            ${roster.map(n=>`<option value="${esc(n)}" ${n===state.s_entry?'selected':''}>${esc(n)}</option>`).join('')}
          </select>
        </div>
      </div>
      ${state.s_class && roster.length===0 ? '<p class="hint" style="color:var(--red);">このクラスの名簿がまだ登録されていません（先生モード→名簿管理）</p>':''}
    </div>`;

    if(state.s_class && state.s_entry){
      html += `<div class="card">
        <h2>③ 自己評価① 主体的に取り組む態度</h2>

  async function submitStudent(){
    const tpl = state.config.templates.find(t=>t.id===state.s_templateId);
    if(!tpl || !state.s_class || !state.s_entry) return;
    const allRatingItems = [...tpl.ratingGroups[0].items, ...tpl.ratingGroups[1].items];
    const missingRating = allRatingItems.some(r=>!state.s_ratings[r.id]);
    if(missingRating){ toast('すべての評価項目を選んでください'); return; }
    const missingReflect = tpl.reflections.some(f=>!(state.s_reflections[f.id]||'').trim());
    if(missingReflect){ toast('感想をすべて記入してください'); return; }

    state.s_submitting = true; render();
    try{
      const resp = {
        id: uid(),
        templateId: tpl.id,
        className: state.s_class,
        entry: state.s_entry,
        ratings: {...state.s_ratings},
        reflections: {...state.s_reflections},
        aiScore: null,
        submittedAt: Date.now(),
      };
      await pushOneResponse(tpl.id, resp);
      state.s_submitting = false;
      state.s_done = true;
      render();
    }catch(e){
      state.s_submitting = false;
      toast('送信に失敗しました。もう一度お試しください');
      render();
    }
  }

  // ---------- AI grading via Anthropic API ----------
  // 以前使っていたGAS+Geminiの採点ロジックと同じ基準・同じ配点方式に合わせている。
  // ・感想①②それぞれの文字数から「記述量ボーナス」を算出（各0〜4点、合計0〜8点）
  // ・感想①②をまとめてAIが0〜10点で採点（内容の深さ・具体性・意欲）
  // ・合計スコア = AI採点(0〜10) + 記述量ボーナス(0〜8) → 最大18点
  function calcLengthBonus(text){
    const len = (text||'').trim().length;
    if(len >= 100) return 4;
    if(len >= 75) return 3;
    if(len >= 50) return 2;
    if(len >= 25) return 1;
    return 0;
  }

  async function gradeResponse(tpl, resp){
    const refIds = tpl.reflections.map(f=>f.id);
    const text1 = resp.reflections[refIds[0]] || '';
    const text2 = resp.reflections[refIds[1]] || '';
    const lengthBonus = calcLengthBonus(text1) + calcLengthBonus(text2);

    const prompt = `あなたは中学校の体育の先生です。生徒が書いた【集団行動】の感想を採点してください。
感想①：${text1}
感想②：${text2}

【重要】感想①と②をそれぞれ5点満点で採点し、合計【0〜10点】の数字のみ返してください。

■採点基準（思考・判断 ＆ 主体的な態度）
・自分の動きの課題を見つけ、どう修正すべきか具体的に考えられているか。
・集団の美しさを高めるための工夫や、周りと合わせるための判断ができているか。
・規律を守り、意欲的に取り組もうとする姿勢が文章から伝わるか。

■ルール
1〜2点：記述が非常に短い、または内容が抽象的。
3点：一般的な感想。
4点：自分や集団の課題を具体的に分析し、工夫した点が書けている。
5点：動きのポイントを深く理解し、高い意欲と深い分析が両立している。

数字のみ返答例：「7」`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
    const response = await fetch(url, {
      method: "post",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const json = await response.json();
    const aiScore = parseInt(json.candidates[0].content.parts[0].text.trim());
    return {
      ai: aiScore,
      bonus: lengthBonus,
      total: aiScore + lengthBonus,
      comment: ''
    };
  }

    state.r_grading[id] = true; render();

      resp.aiScore = score;
      await saveAiScoreOnly(tpl.id, resp.id, score);
    }catch(e){

    delete state.r_grading[id];

    const tpl = state.config.templates.find(t=>t.id===state.r_templateId);
    const targets = state.r_responses.filter(r=>!r.aiScore);
    for(const resp of targets){
      state.r_grading[resp.id] = true; render();
      try{
        const score = await gradeResponse(tpl, resp);
        resp.aiScore = score;
        await saveAiScoreOnly(tpl.id, resp.id, score);
      }catch(e){ /* skip on failure, continue */ }
      delete state.r_grading[resp.id];
      await new Promise(r=>setTimeout(r, 4200)); // Gemini無料枠のレート制限対策

  function exportCsv(){
    const tpl = state.config.templates.find(t=>t.id===state.r_templateId);
    if(!tpl) return;
    const allRatingItems = [...tpl.ratingGroups[0].items, ...tpl.ratingGroups[1].items];
    const headers = ['クラス','出席番号・氏名', ...allRatingItems.map(r=>r.label), ...tpl.reflections.map(f=>f.label), 'AI採点(0-10)','文字数ボーナス(0-8)','合計(0-18)','AI講評'];
    const lines = [headers.join(',')];
    state.r_responses.forEach(r=>{
      const row = [
        r.className, r.entry,
        ...allRatingItems.map(rt=>r.ratings[rt.id]||''),
        ...tpl.reflections.map(f=>`"${(r.reflections[f.id]||'').replace(/"/g,'""')}"`),
        r.aiScore?r.aiScore.ai:'',
        r.aiScore?r.aiScore.bonus:'',
        r.aiScore?r.aiScore.total:'',
        r.aiScore?`"${(r.aiScore.comment||'').replace(/"/g,'""')}"`:'',
      ];
      lines.push(row.join(','));
    });
    const blob = new Blob(["\uFEFF"+lines.join('\n')], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${tpl.name}_回答一覧.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ================= EVENTS =================
  function bindEvents(){
    $app.querySelectorAll('[data-act]').forEach(el=>{
      const act = el.dataset.act;
      const evt = (el.tagName==='SELECT' || el.tagName==='TEXTAREA' || el.tagName==='INPUT') ? 'change' : 'click';
      el.addEventListener(evt, (e)=>handleAction(act, el, e));
      if(el.tagName==='TEXTAREA' && (act==='s_reflect')){
        el.addEventListener('input', (e)=>{ state.s_reflections[el.dataset.fid] = el.value; });
      }
      if(el.tagName==='INPUT' && act && act.startsWith('edit_')){
        el.addEventListener('input', (e)=>handleEditInput(act, el));
      }
    });
  }

  function handleEditInput(act, el){
    const t = state.editingTemplate;
    const idx = el.dataset.idx!==undefined ? parseInt(el.dataset.idx) : null;
    const g = el.dataset.group!==undefined ? parseInt(el.dataset.group) : null;
    if(act==='edit_name') t.name = el.value;
    else if(act==='edit_rating_label') t.ratingGroups[g].items[idx].label = el.value;
    else if(act==='edit_rating_hint') t.ratingGroups[g].items[idx].hint = el.value;
    else if(act==='edit_ref_label') t.reflections[idx].label = el.value;
    else if(act==='edit_ref_hint') t.reflections[idx].hint = el.value;
  }

  async function handleAction(act, el){
    switch(act){
      case 'mode':
        if(el.dataset.val === 'teacher'){
          await enterTeacherMode();
        } else {
          stopRealtimeResponses();
          state.mode = 'student'; render();
        }
        break;

      // student
      case 's_pick_template':
        state.s_templateId = el.value || null;
        state.s_ratings = {}; state.s_reflections = {};
        render(); break;
      case 's_pick_class':
        state.s_class = el.value || null; state.s_entry = null; render(); break;
      case 's_pick_entry':
        state.s_entry = el.value || null; render(); break;
      case 's_rate':
        state.s_ratings[el.dataset.rid] = parseInt(el.dataset.val); render(); break;
      case 's_submit':
        submitStudent(); break;
      case 's_reset_next':
        resetStudentForNext(); break;

      // teacher tabs
      case 'tteam':
        state.teacherTab = el.dataset.val;
        if(state.teacherTab==='responses' && state.r_templateId) startRealtimeResponses(state.r_templateId);
        else stopRealtimeResponses();
        render(); break;

      // templates
      case 'new_tpl':
        state.editingTemplate = blankTemplate(); render(); break;
      case 'edit_tpl':
        state.editingTemplate = JSON.parse(JSON.stringify(state.config.templates.find(t=>t.id===el.dataset.id)));
        render(); break;
      case 'del_tpl': {
        const t = state.config.templates.find(t=>t.id===el.dataset.id);
        state.modal = {kind:'confirmDeleteTemplate', id: el.dataset.id, name: t?t.name:''};
        render();
        break;
      }
      case 'add_rating':
        state.editingTemplate.ratingGroups[parseInt(el.dataset.group)].items.push({id:uid(),label:'',hint:''}); render(); break;
      case 'del_rating': {
        const grp = state.editingTemplate.ratingGroups[parseInt(el.dataset.group)];
        if(grp.items.length<=1){ toast('評価項目は各カテゴリ最低1つ必要です'); return; }
        grp.items.splice(parseInt(el.dataset.idx),1); render(); break;
      }
      case 'add_ref':
        state.editingTemplate.reflections.push({id:uid(),label:'',hint:''}); render(); break;
      case 'del_ref':
        if(state.editingTemplate.reflections.length<=1){ toast('感想項目は最低1つ必要です'); return; }
        state.editingTemplate.reflections.splice(parseInt(el.dataset.idx),1); render(); break;
      case 'save_template': {
        const t = state.editingTemplate;
        if(!t.name.trim()){ toast('種目名を入力してください'); return; }
        const idx = state.config.templates.findIndex(x=>x.id===t.id);
        if(idx>=0) state.config.templates[idx]=t; else state.config.templates.push(t);
        await saveConfig();
        state.editingTemplate = null;
        toast('保存しました');
        render();
        break;
      }
      case 'cancel_edit':
        state.editingTemplate = null; render(); break;

      // roster
      case 'pick_roster_class':
        state.rosterClass = el.dataset.val; state.rosterDraft='';
        render(); break;
      case 'save_roster': {
        const ta = document.getElementById('rosterTextarea');
        const names = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
        state.config.rosters[state.rosterClass] = names;
        await saveConfig();
        state.rosterDraft='';
        toast('名簿を保存しました');
        render();
        break;
      }

      // responses
      case 'pick_r_template':
        state.r_templateId = el.value || null;
        if(state.r_templateId){
          state.r_loading = true; render();
          state.r_responses = await loadResponses(state.r_templateId);
          state.r_loading = false;
          startRealtimeResponses(state.r_templateId);
        } else {
          stopRealtimeResponses();
        }
        render(); break;
      case 'pick_r_class':
        state.r_classFilter = el.value; render(); break;
      case 'grade_one':
        gradeOne(el.dataset.id); break;
      case 'grade_all':
        gradeAll(); break;
      case 'export_csv':
        exportCsv(); break;
      case 'change_pass':
        changeTeacherPassword(); break;
      case 'modal_cancel':
        state.modal = null; render(); break;
      case 'modal_submit_setup':
        await submitTeacherSetup(); break;
      case 'modal_submit_login':
        submitTeacherLogin(); break;
      case 'modal_submit_changepass':
        await submitChangePass(); break;
      case 'modal_confirm_delete_tpl':
        state.config.templates = state.config.templates.filter(t=>t.id!==el.dataset.id);
        await saveConfig();
        state.modal = null;
        render();
        break;
    }
  }

  // init
  (async function init(){
    if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('ここに')===0){
      $app.innerHTML = `
        <div style="max-width:560px;margin:60px auto;padding:28px;font-family:'Noto Sans JP',sans-serif;background:#fff;border:1.5px solid #DFE3EA;border-radius:14px;">
          <h2 style="margin-top:0;color:#152343;">Firebaseの設定がまだです</h2>
          <p style="color:#333;line-height:1.7;">
            このファイルの先頭にある <code>FIREBASE_CONFIG</code> に、あなたのFirebaseプロジェクトの設定値を貼り付けてから使ってください。<br>
            手順はファイル冒頭のコメントに書いてあります。
          </p>
        </div>`;
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
    }catch(e){
      $app.innerHTML = `<div style="max-width:560px;margin:60px auto;padding:28px;font-family:sans-serif;">Firebaseの初期化に失敗しました。FIREBASE_CONFIGの値を確認してください。<br>${esc(e.message)}</div>`;
      return;
    }
    try{
      await loadConfig();
    }catch(e){
      state.config = defaultConfig();
    }
    state.loading = false;
    render();
  })();
})();
</script>

</body>
</html>
