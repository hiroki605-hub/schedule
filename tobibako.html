  function uniq(arr){var s={},r=[];arr.forEach(function(v){if(!s[v]){s[v]=1;r.push(v);}});return r;}

  var S = {
    page:"home",selId:null,scores:{},stuExpanded:null,
    expanded:null,filterCls:"all",
    addOpen:false,bulkOpen:false,
    delConf:null,classModal:false,
    logStu:null,tErr:false,sErr:"",
    pwModal:false,pwOk:false,pwErr:"",
    sFilterCls:"",resetModal:false,resetErr:""
  };

  function render(opts) {
    var app = document.getElementById("app");
    var panel = document.getElementById("scoring-panel");
    var scrollY = panel ? panel.scrollTop : 0;
    var h = "";
    if(S.page==="home") h=vHome();
    else if(S.page==="tlogin") h=vTLogin();
    else if(S.page==="teacher") h=vTeacher();
    else if(S.page==="slogin") h=vSLogin();
    else if(S.page==="stuview") h=vStuView();
    app.innerHTML = h;
    if(opts&&opts.keepScroll){var np=document.getElementById("scoring-panel");if(np)np.scrollTop=scrollY;}
  }

  function vHome(){
    return '<div style="max-width:440px;margin:0 auto;padding:2rem 1.5rem">'
      +'<p style="font-size:12px;color:#999;margin-bottom:4px">葛 体育</p>'
      +'<h1 style="font-size:22px;font-weight:700;margin-bottom:4px">🏅 跳び箱 採点アプリ</h1>'
      +'<p style="color:#999;font-size:13px;margin-bottom:8px">1・2・3年チェックカード</p>'
      +'<div style="background:#FEF3E8;border:1px solid #f6c89b;border-radius:8px;padding:8px 12px;margin-bottom:1.5rem;font-size:12px;color:#b45309">'
      +'📐 段数（男女別5段階・最大5点）＋ 見た目・着地（3段階・最大3点）＝ 各8点満点　11種目 計88点満点</div>'
      +'<div style="display:flex;flex-direction:column;gap:10px">'
      +mBtn("👤","生徒モード","自分の評価を入力する","goSLogin()")
      +mBtn("📋","教師モード","生徒の結果を確認・管理する","goTeacher()")
      +'</div></div>';
  }
  function mBtn(ico,title,sub,fn){
    return '<button onclick="'+fn+'" style="padding:1rem 1.25rem;display:flex;align-items:center;gap:14px;border-radius:12px;text-align:left;border:1px solid #f6c89b">'
      +'<div style="width:40px;height:40px;border-radius:8px;background:#FEF3E8;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">'+ico+'</div>'
      +'<div><div style="font-weight:700;font-size:15px">'+title+'</div><div style="font-size:12px;color:#999;margin-top:2px">'+sub+'</div></div>'
      +'<span style="margin-left:auto;color:#ccc;font-size:20px">›</span></button>';
  }
  function vTLogin(){
    return '<div style="max-width:360px;margin:0 auto;padding:2rem 1.5rem">'
      +'<button onclick="goPage(\'home\')" style="border:none;background:none;color:#888;padding:0 0 1.5rem;font-size:13px">← ホームに戻る</button>'
      +'<h2 style="font-size:18px;font-weight:700;margin-bottom:1.5rem">教師ログイン</h2>'
      +'<div style="display:flex;flex-direction:column;gap:10px">'
      +'<input type="password" id="tpw" placeholder="パスワードを入力"'+(S.tErr?' style="border-color:#d93025"':'')+' onkeydown="if(event.key===\'Enter\')doTLogin()">'
      +(S.tErr?'<p style="color:#d93025;font-size:13px">パスワードが違います</p>':"")
      +'<button class="btn-primary" onclick="doTLogin()">ログイン</button>'
      +'</div></div>';
  }

  function vTeacher(){
    var students = getStudentList();
    var sel = DB.students[S.selId];
    var list = S.filterCls==="all" ? students : students.filter(function(s){return s.cls===S.filterCls;});
    var sb = '<div style="width:220px;border-right:1px solid #e8d0c0;padding:12px 10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:6px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<button onclick="goPage(\'home\')" style="border:none;background:none;color:#888;font-size:12px;padding:0">← 戻る</button>'
      +'<div style="display:flex;gap:2px">'
      +'<button class="btn-icon" onclick="openResetModal()" style="color:#d93025">🗑</button>'
      +'<button class="btn-icon" onclick="openClassModal()">⚙</button>'

    var fOpts='<option value="all">全クラス</option>'+DB.classes.map(function(c){return'<option value="'+c+'"'+(S.filterCls===c?' selected':'')+'>'+c+'</option>';}).join('');
    sb+='<select onchange="setFilter(this.value)">'+fOpts+'</select>';

          +'<button class="btn-icon" style="font-size:14px" onclick="event.stopPropagation();confirmDel(\''+s.id+'\')">🗑</button></div>';

    });
    sb+='</div>';
    var panel='<div id="scoring-panel" style="flex:1;padding:14px;overflow-y:auto">';

        +'<div style="font-size:40px">🏅</div><p>左のリストから生徒を選んでください</p></div>';
    } else {
      var skills=SKILLS[sel.grade];
      var total=calcTotal(S.scores,skills);
      var grade=calcGrade(total);
      var doneSk=skills.filter(function(sk){return S.scores[sk.id+"_d"]!==undefined||S.scores[sk.id+"_k"]!==undefined;}).length;
      var genderTag='<span class="'+(sel.gender==="女子"?"tag-f":"tag-m")+'" style="font-size:12px">'+sel.gender+'</span>';
      panel+='<div class="summary-box">'

        +'<div style="flex:1"><div style="font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px">'+sel.name+' '+genderTag+'</div>'
        +'<div style="font-size:12px;color:#888">'+sel.cls+' #'+sel.number+'</div></div>'
        +'<div style="text-align:right">'
        +'<div id="sum-pts" style="font-size:22px;font-weight:700">'+total+'<span style="font-size:12px;color:#888;font-weight:400">/88</span></div>'
        +'<div id="sum-count" style="font-size:11px;color:#888">'+doneSk+'/11種目</div>'

      panel+='<div style="background:#FEF3E8;border:1px solid #f6c89b;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#b45309">'

      uniq(skills.map(function(s){return s.cat;})).forEach(function(cat){
        var catSk=skills.filter(function(s){return s.cat===cat;});
        panel+='<span class="cat-label cat-'+cat.replace("技","")+'">'+cat+'</span><div style="margin-bottom:14px">';
        catSk.forEach(function(sk){
          var d=S.scores[sk.id+"_d"],k=S.scores[sk.id+"_k"];
          var st=skillTotal(S.scores,sk),hasAny=(d!==undefined||k!==undefined);
          var isExp=S.expanded===sk.id;
          var p1=sel.gender==="女子"?sk.pf:sk.pm;
          panel+='<div class="skill-row" id="row-'+sk.id+'">'
            +'<div class="skill-header" onclick="toggleExp(\''+sk.id+'\')">'
            +'<span style="font-size:11px;color:#aaa;min-width:18px;text-align:right">'+(skills.indexOf(sk)+1)+'</span>'
            +'<span style="flex:1;font-size:13px;font-weight:'+(hasAny?700:400)+'">'+sk.name+'</span>';
          if(hasAny) panel+='<span id="badge-'+sk.id+'" style="font-size:12px;font-weight:700;color:#E67E22;background:#FEF3E8;padding:2px 8px;border-radius:12px;border:1px solid #f6c89b">'+st+'/8点</span>';
          else panel+='<span id="badge-'+sk.id+'" style="font-size:11px;color:#bbb">未評価</span>';
          panel+='<span id="chev-'+sk.id+'" style="color:#bbb;margin-left:6px">'+(isExp?'▲':'▼')+'</span></div>';
          panel+='<div id="detail-'+sk.id+'" class="skill-detail" style="display:'+(isExp?'block':'none')+'">';
          panel+='<div class="score-section"><span class="section-label sl-dan">'+sk.l1+'（最大5点）'
            +(sel.gender==="女子"?'<span class="tag-f">女子</span>':'<span class="tag-m">男子</span>')+'</span>';
          p1.forEach(function(item){
            var active=d&&d.pts===item.pts;
            panel+='<button class="score-btn '+danCls(sel.gender,item.pts)+(active?' active':'')+'\" id="dbtn-'+sk.id+'-'+item.pts+'"'
              +' onclick="doScore(\''+sk.id+'\',\'d\','+item.pts+',\''+item.desc.replace(/'/g,"\\'")+'\')">'
              +'<div class="pts-circle" style="'+danCircleStyle(sel.gender,item.pts)+'">'+item.pts+'</div>'
              +'<span style="flex:1;font-size:12px">'+item.desc+'</span>'
              +(active?'<span style="color:#E67E22">✔</span>':"")
              +'</button>';
          });
          panel+='<div id="dreset-'+sk.id+'" style="display:'+(d?'block':'none')+'">'
            +'<button onclick="doResetScore(\''+sk.id+'\',\'d\')" style="font-size:11px;color:#888;border-color:#ddd;background:#f5f5f5;padding:4px 10px;margin-top:2px">↺ 未評価に戻す</button>'
            +'</div></div>';
          panel+='<div class="score-section"><span class="section-label sl-kata">'+sk.l2+'（最大3点）</span>';
          sk.p2.forEach(function(item){
            var active=k&&k.pts===item.pts;
            var kCls=item.pts===3?"sb-k3":item.pts===2?"sb-k2":"sb-k1";
            panel+='<button class="score-btn '+kCls+(active?' active':'')+'\" id="kbtn-'+sk.id+'-'+item.pts+'"'
              +' onclick="doScore(\''+sk.id+'\',\'k\','+item.pts+',\''+item.desc.replace(/'/g,"\\'")+'\')">'
              +'<div class="pts-circle" style="'+kataCircleStyle(item.pts)+'">'+item.pts+'</div>'
              +'<span style="flex:1;font-size:12px">'+item.desc+'</span>'
              +(active?'<span style="color:#4A86E8">✔</span>':"")
              +'</button>';
          });
          panel+='<div id="kreset-'+sk.id+'" style="display:'+(k!==undefined?'block':'none')+'">'
            +'<button onclick="doResetScore(\''+sk.id+'\',\'k\')" style="font-size:11px;color:#888;border-color:#ddd;background:#f5f5f5;padding:4px 10px;margin-top:2px">↺ 未評価に戻す</button>'
            +'</div></div>';
          panel+='</div></div>';
        });
        panel+='</div>';
      });
      panel+='<div style="background:#fff;border:1px solid #e8d0c0;border-radius:10px;padding:12px 14px;margin-top:8px">'
        +'<p style="font-size:12px;color:#888;margin-bottom:8px">評価基準（88点満点）</p>'
        +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
        +[["A","71点以上"],["B","53〜70点"],["C","35〜52点"],["D","34点以下"]].map(function(r){
          return'<span class="badge b'+gradeOf(r[0])+'"><b>'+r[0]+'</b> '+r[1]+'</span>';
        }).join('')+'</div></div>';
    }
    panel+='</div>';
    var bulkModal="";
    if(S.bulkOpen){
      bulkModal='<div class="modal-overlay" onclick="if(event.target===this)toggleBulk()">'
        +'<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
        +'<h3 style="font-size:16px;font-weight:700">生徒を一括追加</h3>'
        +'<button class="btn-icon" onclick="toggleBulk()">✕</button></div>'
        +'<div style="display:flex;flex-direction:column;gap:10px">'
        +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">クラス</label>'
        +'<select id="bCls">'+DB.classes.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select></div>'
        +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">開始番号</label>'
        +'<input type="number" id="bStart" value="1" min="1" style="max-width:120px"></div>'
        +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:6px">名簿入力（1行1人）</label>'
        +'<div style="background:#f0f4ff;border:1px solid #c5d8fd;border-radius:8px;padding:8px 12px;font-size:12px;color:#1a3a6a;margin-bottom:8px">'
        +'名前の後に「男」か「女」をつけてください<br>例：山田太郎男 / 鈴木花子女</div>'
        +'<textarea id="bNames" rows="10" placeholder="山田太郎男&#10;鈴木花子女&#10;..." style="font-family:monospace;font-size:13px"></textarea></div>'
        +'<p style="font-size:12px;color:#888">※ 初期パスワードは出席番号</p>'
        +'<div style="display:flex;gap:8px">'
        +'<button class="btn-primary" onclick="doBulkAdd()" style="flex:1">追加する</button>'
        +'<button onclick="toggleBulk()" style="flex:1">キャンセル</button>'
        +'</div></div></div></div>';
    }
    var clsModal="";
    if(S.classModal){
      clsModal='<div class="modal-overlay" onclick="if(event.target===this)closeClassModal()">'
        +'<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
        +'<h3 style="font-size:16px;font-weight:700">クラス管理</h3>'
        +'<button class="btn-icon" onclick="closeClassModal()">✕</button></div>'
        +'<div class="tag-list" style="margin-bottom:14px">';
      DB.classes.forEach(function(c){
        clsModal+='<div class="cls-tag"><span>'+c+'</span>'
          +'<button style="border:none;background:none;cursor:pointer;color:#d93025;font-size:14px;padding:0 2px" onclick="delClass(\''+c+'\')">✕</button></div>';
      });

        +'<input id="newCls" placeholder="例: 1年4組"><button class="btn-primary" onclick="addClassItem()" style="white-space:nowrap">追加</button>'

        +'<div style="text-align:center;margin-bottom:16px"><div style="font-size:40px">⚠️</div>'
        +'<h3 style="font-size:17px;font-weight:700;color:#d93025;margin-bottom:8px">全データを削除しますか？</h3>'
        +'<p style="font-size:13px;color:#555;line-height:1.7">この操作は元に戻せません。</p>'
        +'</div><div style="display:flex;flex-direction:column;gap:8px">'

        +'<button onclick="doResetAll()" style="background:#d93025;color:#fff;border-color:#d93025;font-weight:700;padding:10px">削除する</button>'
        +'<button onclick="closeResetModal()">キャンセル</button>'
        +'</div></div></div>';
    }
    return '<div style="display:flex;height:calc(100vh - 33px)">'+sb+panel+'</div>'+bulkModal+clsModal+resetModal;
  }

  function vSLogin(){
    var students=getStudentList();
    var allCls=uniq(students.map(function(s){return s.cls;})).sort();
    var filtered=S.sFilterCls?students.filter(function(s){return s.cls===S.sFilterCls;}):[];
    var clsOpts='<option value="">クラスを選んでください</option>'+allCls.map(function(c){return'<option value="'+c+'"'+(S.sFilterCls===c?' selected':'')+'>'+c+'</option>';}).join('');
    var nameOpts='<option value="">名前を選んでください</option>'+filtered.map(function(s){return'<option value="'+s.id+'">'+s.number+'番　'+s.name+'　（'+s.gender+'）</option>';}).join('');
    return '<div style="max-width:380px;margin:0 auto;padding:2rem 1.5rem">'
      +'<button onclick="goPage(\'home\')" style="border:none;background:none;color:#888;padding:0 0 1.5rem;font-size:13px">← ホームに戻る</button>'
      +'<h2 style="font-size:18px;font-weight:700;margin-bottom:1.5rem">生徒ログイン</h2>'
      +'<div style="display:flex;flex-direction:column;gap:12px">'
      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">① クラス</label>'
      +'<select onchange="setSFilterCls(this.value)">'+clsOpts+'</select></div>'
      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">② 名前</label>'
      +'<select id="sName"'+(S.sErr?' style="border-color:#d93025"':'')+(!S.sFilterCls?' disabled':'')+'>'+nameOpts+'</select></div>'
      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">③ パスワード</label>'
      +'<input type="password" id="sPw" placeholder="パスワードを入力" onkeydown="if(event.key===\'Enter\')doSLogin()"></div>'
      +(S.sErr?'<p style="color:#d93025;font-size:13px">'+S.sErr+'</p>':"")
      +'<button class="btn-primary" onclick="doSLogin()">ログイン</button>'
      +'</div></div>';
  }

  function vStuView(){
    var s=S.logStu;
    var sc=DB.scores[s.id]||{};
    var sk2=SKILLS[s.grade];
    var t2=calcTotal(sc,sk2);
    var gr2=calcGrade(t2);
    var done2=sk2.filter(function(sk){return sc[sk.id+"_d"]!==undefined||sc[sk.id+"_k"]!==undefined;}).length;
    var gTag='<span class="'+(s.gender==="女子"?"tag-f":"tag-m")+'" style="font-size:13px">'+s.gender+'</span>';
    var html='<div style="max-width:640px;margin:0 auto;padding:1rem">'
      +'<div style="display:flex;align-items:center;gap:8px;border-bottom:1px solid #e8d0c0;padding-bottom:12px;margin-bottom:14px">'
      +'<button onclick="goSLogin()" style="border:none;background:none;color:#888;font-size:20px;padding:4px">←</button>'
      +'<h2 style="font-size:16px;font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:8px">'+s.name+' さん '+gTag+'</h2>'
      +'<button onclick="openPwModal()" style="font-size:12px;padding:6px 12px">🔑 PW変更</button>'
      +'</div>';
    if(s.isDefault) html+='<div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;font-size:13px;color:#7a5c00;margin-bottom:12px">⚠️ 初期パスワード（出席番号）のままです。</div>';
    html+='<div class="summary-box">'
      +'<div class="grade-circle" style="'+gcStyle(gr2)+'">'+gr2+'</div>'
      +'<div style="flex:1"><div style="font-size:24px;font-weight:700">'+t2+'<span style="font-size:14px;color:#888;font-weight:400"> / 88点</span></div>'
      +'<div style="font-size:12px;color:#888;margin-top:2px">'+done2+'/11種目評価済み</div>'
      +'</div></div>';
    uniq(sk2.map(function(s){return s.cat;})).forEach(function(cat){
      var catSk=sk2.filter(function(s){return s.cat===cat;});
      html+='<span class="cat-label cat-'+cat.replace("技","")+'">'+cat+'</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">';
      catSk.forEach(function(sk){
        var d=sc[sk.id+"_d"],k=sc[sk.id+"_k"];
        var st=skillTotal(sc,sk),hasAny=(d!==undefined||k!==undefined);
        var isExp2=S.stuExpanded===sk.id;
        html+='<div class="skill-row" id="srow-'+sk.id+'">'
          +'<div class="skill-header" onclick="toggleStuExp(''+sk.id+'')" style="padding:8px 10px">'
          +'<span style="font-size:11px;color:#aaa;min-width:16px">'+(sk2.indexOf(sk)+1)+'</span>'
          +'<span style="flex:1;font-size:13px;font-weight:'+(hasAny?700:400)+'">'+sk.name+'</span>';
        if(hasAny) html+='<span style="font-size:12px;font-weight:700;color:#E67E22;background:#FEF3E8;padding:2px 8px;border-radius:12px;border:1px solid #f6c89b">'+st+'/8点</span>';
        else html+='<span style="font-size:11px;color:#bbb">未評価</span>';
        html+='<span style="color:#bbb;margin-left:6px">'+(isExp2?'▲':'▼')+'</span></div>';
        html+='<div id="sdetail-'+sk.id+'" class="skill-detail" style="display:'+(isExp2?'block':'none')+'">';
        var p1s=s.gender==="女子"?sk.pf:sk.pm;
        html+='<div class="score-section"><span class="section-label sl-dan">'+sk.l1+'（最大5点）'
          +(s.gender==="女子"?'<span class="tag-f">女子</span>':'<span class="tag-m">男子</span>')+'</span>';
        p1s.forEach(function(item){
          var active=d&&d.pts===item.pts;
          html+='<button class="score-btn '+danCls(s.gender,item.pts)+(active?' active':'')
            +'" onclick="doStuScore(''+sk.id+'','d','+item.pts+',''+item.desc.replace(/'/g,"\'")+'')">'
            +'<div class="pts-circle" style="'+danCircleStyle(s.gender,item.pts)+'">'+item.pts+'</div>'
            +'<span style="flex:1;font-size:12px">'+item.desc+'</span>'
            +(active?'<span style="color:#E67E22">✔</span>':"")
            +'</button>';
        });
        html+='</div>';
        html+='<div class="score-section"><span class="section-label sl-kata">'+sk.l2+'（最大3点）</span>';
        sk.p2.forEach(function(item){
          var active=k&&k.pts===item.pts;
          var kCls=item.pts===3?"sb-k3":item.pts===2?"sb-k2":"sb-k1";
          html+='<button class="score-btn '+kCls+(active?' active':'')
            +'" onclick="doStuScore(''+sk.id+'','k','+item.pts+',''+item.desc.replace(/'/g,"\'")+'')">'
            +'<div class="pts-circle" style="'+kataCircleStyle(item.pts)+'">'+item.pts+'</div>'
            +'<span style="flex:1;font-size:12px">'+item.desc+'</span>'
            +(active?'<span style="color:#4A86E8">✔</span>':"")
            +'</button>';
        });
        html+='</div>';
        html+='</div></div>';
      });
      html+='</div>';
    });
    html+='<div style="background:#fff;border:1px solid #e8d0c0;border-radius:10px;padding:12px 14px;margin-top:8px">'
      +'<p style="font-size:12px;color:#888;margin-bottom:8px">評価基準（88点満点）</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +[["A","71点以上"],["B","53〜70点"],["C","35〜52点"],["D","34点以下"]].map(function(r){
        return'<span class="badge b'+gradeOf(r[0])+'"><b>'+r[0]+'</b> '+r[1]+'</span>';
      }).join('')+'</div></div></div>';
    if(S.pwModal){
      html+='<div class="modal-overlay" onclick="if(event.target===this)closePwModal()">'
        +'<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
        +'<h3 style="font-size:16px;font-weight:700">パスワード変更</h3>'
        +'<button class="btn-icon" onclick="closePwModal()">✕</button></div>';
      if(S.pwOk){
        html+='<p style="color:#1e6b2e;font-size:14px;text-align:center;padding:1rem">✅ 変更しました！</p>'
          +'<button class="btn-primary" onclick="closePwModal()" style="width:100%">閉じる</button>';
      } else {
        html+='<div style="display:flex;flex-direction:column;gap:10px">'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">現在のパスワード</label><input type="password" id="pwOld"></div>'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">新しいパスワード（4文字以上）</label><input type="password" id="pwNew"></div>'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">確認</label><input type="password" id="pwNew2"></div>'
          +(S.pwErr?'<p style="color:#d93025;font-size:13px">'+S.pwErr+'</p>':"")
          +'<div style="display:flex;gap:8px">'
          +'<button class="btn-primary" onclick="doChangePw()" style="flex:1">変更する</button>'
          +'<button onclick="closePwModal()" style="flex:1">キャンセル</button>'
          +'</div></div>';
      }
      html+='</div></div>';
    }
    return html;
  }

  // アクション
  window.toggleStuExp=function(id){
    var det=document.getElementById("sdetail-"+id);
    if(!det)return;
    var open=det.style.display!=="none";
    if(S.stuExpanded&&S.stuExpanded!==id){
      var o=document.getElementById("sdetail-"+S.stuExpanded);
      if(o)o.style.display="none";
    }
    if(open){det.style.display="none";S.stuExpanded=null;}
    else{det.style.display="block";S.stuExpanded=id;}
    // 矢印更新
    var row=document.getElementById("srow-"+id);
    if(row){var spans=row.querySelectorAll(".skill-header span");var last=spans[spans.length-1];if(last)last.textContent=open?'▼':'▲';}
  };

  window.doStuScore=function(skillId,part,pts,label){
    var key=skillId+"_"+part;
    var sc=DB.scores[S.logStu.id]||{};
    sc[key]={pts:pts,label:label};
    dbSet('scores/'+S.logStu.id+'/'+key,{pts:pts,label:label},function(){});
    // ボタン更新
    var prefix=part==="d"?"dbtn2-":"kbtn2-";
    render({keepScroll:true});
  };

  window.goPage=function(p){S.page=p;S.tErr=false;S.sErr="";render();};
  window.goTeacher=function(){S.page="tlogin";render();};
  window.goSLogin=function(){S.page="slogin";S.sErr="";render();};
  window.doTLogin=function(){
    var pw=document.getElementById("tpw").value;
    if(pw===TEACHER_PASS){S.tErr=false;S.page="teacher";}else S.tErr=true;
    render();
  };
  window.toggleAdd=function(){S.addOpen=!S.addOpen;S.bulkOpen=false;render();};
  window.toggleBulk=function(){S.bulkOpen=!S.bulkOpen;S.addOpen=false;render();};
  window.openClassModal=function(){S.classModal=true;render();};
  window.closeClassModal=function(){S.classModal=false;render();};
  window.setFilter=function(v){S.filterCls=v;render();};
  window.confirmDel=function(id){S.delConf=id;render();};
  window.cancelDel=function(){S.delConf=null;render();};
  window.setSFilterCls=function(v){S.sFilterCls=v;S.sErr="";render();};
  window.openResetModal=function(){S.resetModal=true;S.resetErr="";render();};
  window.closeResetModal=function(){S.resetModal=false;render();};
  window.openPwModal=function(){S.pwModal=true;S.pwOk=false;S.pwErr="";render();};
  window.closePwModal=function(){S.pwModal=false;render();};

  window.toggleExp=function(id){
    var det=document.getElementById("detail-"+id),chev=document.getElementById("chev-"+id);
    if(!det)return;
    var open=det.style.display!=="none";
    if(S.expanded&&S.expanded!==id){
      var o=document.getElementById("detail-"+S.expanded),oc=document.getElementById("chev-"+S.expanded);
      if(o)o.style.display="none";if(oc)oc.textContent="▼";
    }
    if(open){det.style.display="none";if(chev)chev.textContent="▼";S.expanded=null;}
    else{det.style.display="block";if(chev)chev.textContent="▲";S.expanded=id;}
  };

  window.toggleGender=function(id,cur){
    var ng=cur==="男子"?"女子":"男子";
    dbSet('students/'+id+'/gender',ng);
  };

  window.doScore=function(skillId,part,pts,label){
    var key=skillId+"_"+part;
    S.scores[key]={pts:pts,label:label};
    var prefix=part==="d"?"dbtn-":"kbtn-";
    [1,2,3,4,5].forEach(function(p){
      var b=document.getElementById(prefix+skillId+"-"+p);
      if(b)b.classList.remove("active");
    });
    var ab=document.getElementById(prefix+skillId+"-"+pts);
    if(ab)ab.classList.add("active");
    var rb=document.getElementById((part==="d"?"dreset-":"kreset-")+skillId);
    if(rb)rb.style.display="block";
    updateBadge(skillId);updateSummaryDOM();
    dbSet('scores/'+S.selId+'/'+key,{pts:pts,label:label});
  };

  window.doResetScore=function(skillId,part){
    if(!confirm("未評価に戻しますか？"))return;
    var key=skillId+"_"+part;
    delete S.scores[key];
    var prefix=part==="d"?"dbtn-":"kbtn-";
    [1,2,3,4,5].forEach(function(p){
      var b=document.getElementById(prefix+skillId+"-"+p);
      if(b)b.classList.remove("active");
    });
    var rb=document.getElementById((part==="d"?"dreset-":"kreset-")+skillId);
    if(rb)rb.style.display="none";
    updateBadge(skillId);updateSummaryDOM();
    dbRemove('scores/'+S.selId+'/'+key);
  };

  function updateBadge(skillId){
    var sel=DB.students[S.selId];if(!sel)return;
    var sk=SKILLS[sel.grade].filter(function(s){return s.id===skillId;})[0];if(!sk)return;
    var st=skillTotal(S.scores,sk),d=S.scores[skillId+"_d"],k=S.scores[skillId+"_k"];
    var has=(d!==undefined||k!==undefined);
    var b=document.getElementById("badge-"+skillId);
    if(b){if(has){b.style.cssText="font-size:12px;font-weight:700;color:#E67E22;background:#FEF3E8;padding:2px 8px;border-radius:12px;border:1px solid #f6c89b";b.textContent=st+"/8点";}
    else{b.style.cssText="font-size:11px;color:#bbb";b.textContent="未評価";}}
  }
  function updateSummaryDOM(){
    var sel=DB.students[S.selId];if(!sel)return;
    var skills=SKILLS[sel.grade],total=calcTotal(S.scores,skills),grade=calcGrade(total);
    var done=skills.filter(function(sk){return S.scores[sk.id+"_d"]!==undefined||S.scores[sk.id+"_k"]!==undefined;}).length;
    var gc=document.getElementById("sum-grade"),gp=document.getElementById("sum-pts"),gsc=document.getElementById("sum-count");
    if(gc){gc.textContent=grade;gc.style.cssText=gcStyle(grade)+";width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0";}
    if(gp)gp.innerHTML=total+'<span style="font-size:12px;color:#888;font-weight:400">/88</span>';
    if(gsc)gsc.textContent=done+"/11種目";
  }

  window.doAddStu=function(){
    var name=document.getElementById("nName").value.trim();
    var num=document.getElementById("nNum").value.trim();
    var cls=document.getElementById("nCls").value;
    var gender=document.getElementById("nGender").value;
    if(!name||!num){alert("名前と出席番号を入力してください");return;}
    var id=genId();
    dbSet('students/'+id,{id:id,name:name,number:num,cls:cls,grade:gradeFromCls(cls),gender:gender,password:num,isDefault:true},function(){
      S.addOpen=false;render();
    });
  };

  window.doBulkAdd=function(){
    var cls=document.getElementById("bCls").value;
    var start=parseInt(document.getElementById("bStart").value)||1;
    var lines=document.getElementById("bNames").value.split("\n").map(function(n){return n.trim();}).filter(function(n){return n;});
    if(!lines.length){alert("名前を入力してください");return;}
    var count=0;
    var total=lines.length;
    lines.forEach(function(line,i){
      var parts=line.split(/[\s　]+/);
      var name,gender;
      if(parts.length>=2){
        var last=parts[parts.length-1];
        if(last==="女"||last==="女子"){gender="女子";name=parts.slice(0,-1).join("");}
        else if(last==="男"||last==="男子"){gender="男子";name=parts.slice(0,-1).join("");}
        else{gender=(line.endsWith("女")||line.endsWith("女子"))?"女子":"男子";name=line.replace(/[男女]子?$/,"").trim();}
      } else {
        gender=(line.endsWith("女")||line.endsWith("女子"))?"女子":"男子";
        name=line.replace(/[男女]子?$/,"").trim();
      }
      var num=String(start+i);
      var id=genId();
      dbSet('students/'+id,{id:id,name:name,number:num,cls:cls,grade:gradeFromCls(cls),gender:gender,password:num,isDefault:true},function(){
        count++;
        if(count===total){S.bulkOpen=false;alert(count+"人を追加しました！初期パスワードは出席番号です。");render();}
      });
    });
  };

  window.doDelStu=function(id){
    dbRemove('students/'+id);
    dbRemove('scores/'+id);
    if(S.selId===id){S.selId=null;S.scores={};}
    S.delConf=null;render();
  };

  window.pickStu=function(id){
    S.selId=id;S.expanded=null;
    S.scores=DB.scores[id]||{};
    render();
  };

  window.addClassItem=function(){
    var v=document.getElementById("newCls").value.trim();
    if(!v)return;
    if(DB.classes.indexOf(v)>=0){alert("すでに存在するクラスです");return;}
    dbSet('classes',DB.classes.concat([v]));
  };
  window.delClass=function(cls){
    if(!confirm("「"+cls+"」を削除しますか？"))return;
    dbSet('classes',DB.classes.filter(function(c){return c!==cls;}));
  };

  window.doSLogin=function(){
    var selEl=document.getElementById("sName");
    var id=selEl?selEl.value:"";
    var pw=document.getElementById("sPw")?document.getElementById("sPw").value:"";
    if(!id){S.sErr="名前を選んでください";render();return;}
    var stu=DB.students[id];
    if(!stu||stu.password!==pw){S.sErr="名前またはパスワードが違います";render();return;}
    S.logStu=stu;S.page="stuview";render();
  };

  window.doChangePw=function(){
    var o=document.getElementById("pwOld").value;
    var n=document.getElementById("pwNew").value;
    var n2=document.getElementById("pwNew2").value;
    if(n!==n2){S.pwErr="新しいパスワードが一致しません";render();return;}
    if(n.length<4){S.pwErr="4文字以上にしてください";render();return;}
    if(S.logStu.password!==o){S.pwErr="現在のパスワードが違います";render();return;}
    dbSet('students/'+S.logStu.id+'/password',n);
    dbSet('students/'+S.logStu.id+'/isDefault',false,function(){
      S.logStu=Object.assign({},S.logStu,{password:n,isDefault:false});
      S.pwOk=true;render();
    });
  };

  window.doResetAll=function(){
    var pw=document.getElementById("resetPw").value;
    if(pw!==TEACHER_PASS){S.resetErr="パスワードが違います";render();return;}
    dbRemove('students');dbRemove('scores');
    S.selId=null;S.scores={};S.resetModal=false;S.resetErr="";
    alert("✅ 全データを削除しました。");render();
  };

  // Firebase リアルタイム監視
  dbRef.on('value', function(snap){
    var val=snap.val()||{};
    DB.classes=val.classes||[];
    DB.students=val.students||{};
    DB.scores=val.scores||{};
    setSyncBar('ok','✅ リアルタイム同期中');
    if(S.page==='teacher'||S.page==='stuview') render({keepScroll:true});
    else render();
  }, function(err){
    setSyncBar('err','❌ 接続エラー: '+err.message);
    render();
  });

  // 初期表示
  render();
}
</script>
</body>
</html>
