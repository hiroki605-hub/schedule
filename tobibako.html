function calcGrade(t){if(t>=71)return"A";if(t>=53)return"B";if(t>=35)return"C";return"D";}
function gcStyle(g){if(g==="A")return"background:#e6f4ea;color:#1e6b2e";if(g==="B")return"background:#e8f0fe;color:#1a56c4";if(g==="C")return"background:#fef7e0;color:#8a6000";return"background:#fce8e6;color:#a50e0e";}
function gradeOf(g){if(g==="A")return"a";if(g==="B")return"b";if(g==="C")return"c";return"d";}
function skillTotal(sc,sk){var d=sc[sk.id+"_d"],k=sc[sk.id+"_k"];return(d?d.pts:0)+(k?k.pts:0);}
function calcTotal(sc,skills){return skills.reduce((s,sk)=>s+skillTotal(sc,sk),0);}
function gradeFromCls(cls){if(cls.indexOf("1年")>=0)return 1;if(cls.indexOf("2年")>=0)return 2;return 3;}

  const app = document.getElementById("app");
  const panel = document.getElementById("scoring-panel");
  const scrollY = panel ? panel.scrollTop : 0;
  if(S.loading){app.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">読み込み中...</p></div>';return;}
  let h="";
  if(S.page==="home") h=vHome();
  else if(S.page==="tlogin") h=vTLogin();
  else if(S.page==="teacher") h=vTeacher();
  else if(S.page==="slogin") h=vSLogin();
  else if(S.page==="stuview") h=vStuView();
  app.innerHTML=h;
  if(opts&&opts.keepScroll){const np=document.getElementById("scoring-panel");if(np)np.scrollTop=scrollY;}
}

}

window.doScore = (skillId,part,pts,label)=>{

  [1,2,3,4,5].forEach(p=>{

  const key=skillId+"_"+part;
  delete S.scores[key];
  const prefix=part==="d"?"dbtn-":"kbtn-";
  [1,2,3,4,5].forEach(p=>{
    const b=document.getElementById(prefix+skillId+"-"+p);
    if(b){b.classList.remove("active");const c=b.querySelector(".sc-chk");if(c)b.removeChild(c);}

function updateBadge(skillId){
  const sel=DB.students[S.selId]; if(!sel)return;
  const sk=SKILLS[sel.grade].find(s=>s.id===skillId); if(!sk)return;
  const st=skillTotal(S.scores,sk),d=S.scores[skillId+"_d"],k=S.scores[skillId+"_k"];
  const has=(d!==undefined||k!==undefined);
  const b=document.getElementById("badge-"+skillId);
  if(b){if(has){b.style.cssText="font-size:12px;font-weight:700;color:#E67E22;background:#FEF3E8;padding:2px 8px;border-radius:12px;border:1px solid #f6c89b";b.textContent=st+"/8点";}
  else{b.style.cssText="font-size:11px;color:#bbb";b.textContent="未評価";}}
}
function updateSummaryDOM(){
  const sel=DB.students[S.selId]; if(!sel)return;
  const skills=SKILLS[sel.grade],total=calcTotal(S.scores,skills),grade=calcGrade(total);
  const done=skills.filter(sk=>S.scores[sk.id+"_d"]!==undefined||S.scores[sk.id+"_k"]!==undefined).length;
  const gc=document.getElementById("sum-grade"),gp=document.getElementById("sum-pts"),gsc=document.getElementById("sum-count");
  if(gc){gc.textContent=grade;gc.style.cssText=gcStyle(grade)+";width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0";}
  if(gp)gp.innerHTML=total+'<span style="font-size:12px;color:#888;font-weight:400">/88</span>';
  if(gsc)gsc.textContent=done+"/11種目";
}

window.doAddStu = async ()=>{
  const name=document.getElementById("nName").value.trim();
  const num=document.getElementById("nNum").value.trim();
  const cls=document.getElementById("nCls").value;
  const gender=document.getElementById("nGender").value;
  if(!name||!num){alert("名前と出席番号を入力してください");return;}
  const id=genId();
  await dbSet('students/'+id, {id,name,number:num,cls,grade:gradeFromCls(cls),gender,password:num,isDefault:true});
  S.addOpen=false; render();
};

window.doBulkAdd = async ()=>{
  const cls=document.getElementById("bCls").value;
  const start=parseInt(document.getElementById("bStart").value)||1;
  const lines=document.getElementById("bNames").value.split("\n").map(n=>n.trim()).filter(n=>n);
  if(!lines.length){alert("名前を入力してください");return;}
  let count=0;
  for(let i=0;i<lines.length;i++){
    const parts=lines[i].split(/[\s　]+/);
    // 性別判定: スペースあり「田中 花子 女」/ スペースなし「田中花子女」両対応
    let name,gender;
    if(parts.length>=2){
      const last=parts[parts.length-1];
      if(last==="女"||last==="女子"){gender="女子";name=parts.slice(0,-1).join("");}
      else if(last==="男"||last==="男子"){gender="男子";name=parts.slice(0,-1).join("");}
      else{// 最後の文字で判定
        const raw2=lines[i];
        gender=(raw2.endsWith("女")||raw2.endsWith("女子"))?"女子":"男子";
        name=raw2.replace(/[男女]子?$/,"").replace(/\s+$/,"");
      }
    } else {
      const raw2=lines[i];
      gender=(raw2.endsWith("女")||raw2.endsWith("女子"))?"女子":"男子";
      name=raw2.replace(/[男女]子?$/,"").trim();
    }
    const num=String(start+i);
    const id=genId();
    await dbSet('students/'+id, {id,name,number:num,cls,grade:gradeFromCls(cls),gender,password:num,isDefault:true});
    count++;
  }
  S.bulkOpen=false;
  alert(count+"人を追加しました！初期パスワードは出席番号です。");
  render();
};

};
window.delClass = async cls=>{
  if(!confirm("「"+cls+"」を削除しますか？"))return;
  await dbSet('classes',DB.classes.filter(c=>c!==cls));
};

window.doSLogin = ()=>{
  const selEl=document.getElementById("sName");
  const id=selEl?selEl.value:"";
  const pw=document.getElementById("sPw")?document.getElementById("sPw").value:"";
  if(!id){S.sErr="名前を選んでください";render();return;}
  const stu=DB.students[id];
  if(!stu||stu.password!==pw){S.sErr="名前またはパスワードが違います";render();return;}
  S.logStu=stu; S.page="stuview"; render();
};

window.openPwModal = ()=>{ S.pwModal=true; S.pwOk=false; S.pwErr=""; render(); };
window.closePwModal = ()=>{ S.pwModal=false; render(); };
window.doChangePw = async ()=>{
  const o=document.getElementById("pwOld").value;
  const n=document.getElementById("pwNew").value;
  const n2=document.getElementById("pwNew2").value;
  if(n!==n2){S.pwErr="新しいパスワードが一致しません";render();return;}
  if(n.length<4){S.pwErr="4文字以上にしてください";render();return;}
  if(S.logStu.password!==o){S.pwErr="現在のパスワードが違います";render();return;}
  await dbSet('students/'+S.logStu.id+'/password',n);
  await dbSet('students/'+S.logStu.id+'/isDefault',false);
  S.logStu={...S.logStu,password:n,isDefault:false};
  S.pwOk=true; render();
};

window.doResetAll = async ()=>{
  const pw=document.getElementById("resetPw").value;
  if(pw!==TEACHER_PASS){S.resetErr="パスワードが違います";render();return;}
  await dbRemove('students');
  await dbRemove('scores');
  S.selId=null;S.scores={};S.resetModal=false;S.resetErr="";
  alert("✅ 全データを削除しました。");render();
};

// ─── Firebase 接続・初期表示（全関数定義後に実行）───
const dbRef = ref(db, 'tobibako');
onValue(dbRef, snap => {
  const val = snap.val() || {};
  DB.classes = val.classes || [];
  DB.students = val.students || {};
  DB.scores = val.scores || {};
  setSyncBar('ok', '✅ リアルタイム同期中');
  if (S.page === 'teacher' || S.page === 'stuview') render({keepScroll: true});
  else render();
}, err2 => {
  setSyncBar('err', '❌ 接続エラー: ' + err2.message);
  render();
});

// 初期表示
render();

</script>
</body>
