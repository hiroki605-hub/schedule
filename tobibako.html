    return DEFAULT_THRESH.map(function(pair){
      var v=ov[pair[0]];
      return [pair[0],(v!==undefined&&v!==null&&v!=="")?Number(v):pair[1]];
    });
  }
  function calcGrade(t){
    var th=getThresh();
    for(var i=0;i<th.length;i++){if(t>=th[i][1])return th[i][0];}
    return BOTTOM_GRADE;

  function getStudents(){return Object.keys(DB.students).map(function(k){return DB.students[k];}).sort(function(a,b){return a.cls.localeCompare(b.cls)||Number(a.number)-Number(b.number);});}
  function uniq(arr){var s={},r=[];arr.forEach(function(v){if(!s[v]){s[v]=1;r.push(v);}});return r;}
  function escapeHtml(str){return String(str==null?"":str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function findSkillById(id){
    for(var g=1;g<=3;g++){
      var arr=SKILLS[g];
      for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}
    }
    return null;
  }
  // 評価基準（各段階の説明文）の教師編集を反映した内容を返す
  function getCriteria(sk){
    var ov=DB.criteria&&DB.criteria[sk.id];
    function resolve(arr,key){
      return arr.map(function(item){
        var v=(ov&&ov[key]&&ov[key][item.pts]!==undefined&&ov[key][item.pts]!=="")?ov[key][item.pts]:item.desc;
        return {pts:item.pts,desc:v};
      });
    }
    return {pm:resolve(sk.pm,'pm'),pf:resolve(sk.pf,'pf'),p2:resolve(sk.p2,'p2')};
  }

    delConf:null,classModal:false,resetModal:false,resetErr:"",
    rankingModal:false,rankingFilterCls:"all",

    logStu:null,stuScores:{},stuExpanded:null,

  // Google Sites 等のサンドボックス化された iframe 内では window.confirm() / alert()

  function showConfirm(msg,action,arg){S.confirmModal={msg:msg,action:action,arg:arg};render();}
  function showAlert(msg){S.alertMsg=msg;render();}
  window.confirmModalYes=function(){
    var cm=S.confirmModal;S.confirmModal=null;
    if(!cm){render();return;}
    if(cm.action==='resetScoreT'){
      delete S.tScores[cm.arg];
      dbRemove('scores/'+S.selId+'/'+cm.arg);
      render({keepScroll:true});
    }else if(cm.action==='resetScoreS'){
      delete S.stuScores[cm.arg];
      dbRemove('scores/'+S.logStu.id+'/'+cm.arg);
      render({keepScroll:true});
    }else if(cm.action==='delClass'){
      dbSet('classes',DB.classes.filter(function(c){return c!==cm.arg;}));
      render();

      render();
    }

  window.confirmModalNo=function(){S.confirmModal=null;render();};
  window.closeAlertModal=function(){S.alertMsg=null;render();};

  // 評価基準の編集（教師モードのみ）
  window.openEditCriteria=function(skillId){S.editCriteria=skillId;render();};
  window.closeEditCriteria=function(){S.editCriteria=null;render();};
  window.saveEditCriteria=function(skillId){
    var sk=findSkillById(skillId);if(!sk)return;
    var newOv={pm:{},pf:{},p2:{}},ok=true;
    ['pm','pf','p2'].forEach(function(key){
      sk[key].forEach(function(item){
        var el=document.getElementById('ec_'+key+'_'+item.pts);
        var v=el?el.value.trim():'';
        if(!v)ok=false;
        newOv[key][item.pts]=v;
      });
    });
    if(!ok){showAlert("すべての基準を入力してください");return;}
    dbSet('criteria/'+skillId,newOv,function(){
      DB.criteria[skillId]=newOv;
      S.editCriteria=null;
      render({keepScroll:true});
    });
  };
  window.resetEditCriteria=function(skillId){
    dbRemove('criteria/'+skillId);
    delete DB.criteria[skillId];
    S.editCriteria=null;
    render({keepScroll:true});
  };
  function renderGradeCriteria(isTeacher){
    var th=getThresh();
    var items=th.map(function(pair,i){
      var label=pair[0],min=pair[1];
      var text=i===0?(min+"点以上"):(min+"〜"+(th[i-1][1]-1)+"点");
      return [label,text];
    });
    items.push([BOTTOM_GRADE,(th[th.length-1][1]-1)+"点以下"]);
    var editBtn=isTeacher?'<button onclick="openEditThreshold()" style="font-size:11px;color:#E67E22;border-color:#f6c89b;background:#FEF3E8;padding:4px 10px;margin-bottom:8px">✏️ 評価基準（点数）を編集</button>':'';
    return '<div style="background:#fff;border:1px solid #e8d0c0;border-radius:10px;padding:12px 14px;margin-top:8px">'
      +editBtn
      +'<p style="font-size:12px;color:#888;margin-bottom:8px">評価基準（基本技56点満点・加点技を除く）</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +items.map(function(r){return'<span class="badge b'+gradeOf(r[0])+'"><b>'+r[0]+'</b> '+r[1]+'</span>';}).join('')
      +'</div></div>';
  }

  window.openEditThreshold=function(){S.editThreshold=true;render();};
  window.closeEditThreshold=function(){S.editThreshold=false;render();};
  window.saveEditThreshold=function(){
    var newOv={},ok=true,prev=null;
    for(var i=0;i<DEFAULT_THRESH.length;i++){
      var label=DEFAULT_THRESH[i][0];
      var el=document.getElementById('et_'+label);
      var v=el?el.value.trim():'';
      if(v===""||isNaN(Number(v))){ok=false;break;}
      var num=Number(v);
      if(prev!==null&&num>=prev){ok=false;break;}
      newOv[label]=num;
      prev=num;
    }
    if(!ok){showAlert("点数を正しく入力してください（上のグレードほど高い点数にしてください）");return;}
    dbSet('thresholds/main',newOv,function(){
      DB.thresholds.main=newOv;
      S.editThreshold=false;render({keepScroll:true});
    });
  };
  window.resetEditThreshold=function(){
    dbRemove('thresholds/main');
    delete DB.thresholds.main;
    S.editThreshold=false;
    render({keepScroll:true});
  };

  function render(opts){

    app.innerHTML=h;

  // ─── 生徒ログイン ───
  function vSLogin(){
    var students=getStudents();
    var allCls=uniq(students.map(function(s){return s.cls;})).sort();

    var clsOpts='<option value="">クラスを選んでください</option>'+allCls.map(function(c){return'<option value="'+c+'"'+(S.sFilterCls===c?' selected':'')+'>'+c+'</option>';}).join('');
    var nameOpts='<option value="">出席番号を選んでください</option>'+filtered.map(function(s){return'<option value="'+s.id+'">'+s.number+'番</option>';}).join('');
    return '<div style="max-width:380px;margin:0 auto;padding:2rem 1.5rem">'
      +'<button onclick="goPage(\'home\')" style="border:none;background:none;color:#888;padding:0 0 1.5rem;font-size:13px">← ホームに戻る</button>'
      +'<h2 style="font-size:18px;font-weight:700;margin-bottom:4px">生徒ログイン</h2>'
      +'<p style="font-size:12px;color:#aaa;margin-bottom:1.5rem">自分の評価を入力できます。初期パスワードは出席番号です。</p>'

      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">① クラス</label>'
      +'<select onchange="setSFilterCls(this.value)">'+clsOpts+'</select></div>'
      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">② 出席番号</label>'
      +'<select id="sName"'+(!S.sFilterCls?' disabled':'')+'>'+nameOpts+'</select>'
      +(!S.sFilterCls?'<p style="font-size:11px;color:#aaa;margin-top:3px">クラスを選ぶと出席番号が表示されます</p>':'')+'</div>'
      +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">③ パスワード <span style="color:#aaa">（初期：出席番号）</span></label>'

    var baseTotal=calcBaseTotal(sc,skills);

        });
        html+='<div style="display:'+(k!==undefined?'block':'none')+'" id="skreset-'+sk.id+'">'
          +'<button onclick="doStuReset(\''+sk.id+'\',\'k\')" style="font-size:11px;color:#888;border-color:#ddd;background:#f5f5f5;padding:4px 10px;margin-top:2px">↺ 未入力に戻す</button></div></div>';
        html+='</div></div>';
      });
      html+='</div>';
    });
    html+=renderGradeCriteria(false)+'</div>';

    if(S.pwModal){
      html+='<div class="modal-overlay" onclick="if(event.target===this)closePwModal()">'
        +'<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
        +'<h3 style="font-size:16px;font-weight:700">パスワード変更</h3>'
        +'<button class="btn-icon" onclick="closePwModal()">✕</button></div>';
      if(S.pwOk){
        html+='<p style="color:#1e6b2e;font-size:14px;text-align:center;padding:1rem">✅ パスワードを変更しました！</p>'
          +'<button class="btn-primary" onclick="closePwModal()" style="width:100%">閉じる</button>';
      } else {
        html+='<div style="display:flex;flex-direction:column;gap:10px">'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">現在のパスワード</label>'
          +'<input type="password" id="pwOld" placeholder="現在のパスワード"></div>'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">新しいパスワード（4文字以上）</label>'
          +'<input type="password" id="pwNew"></div>'
          +'<div><label style="font-size:12px;color:#888;display:block;margin-bottom:4px">新しいパスワード（確認）</label>'
          +'<input type="password" id="pwNew2"></div>'
          +(S.pwErr?'<p style="color:#d93025;font-size:13px">'+S.pwErr+'</p>':"")
          +'<div style="display:flex;gap:8px">'
          +'<button class="btn-primary" onclick="doChangePw()" style="flex:1">変更する</button>'
          +'<button onclick="closePwModal()" style="flex:1">キャンセル</button>'
          +'</div></div>';
      }
      html+='</div></div>';
    }
    if(S.confirmModal){
      html+='<div class="modal-overlay"><div class="modal" style="max-width:340px">'
        +'<p style="font-size:15px;font-weight:600;margin-bottom:18px;text-align:center">'+S.confirmModal.msg+'</p>'
        +'<div style="display:flex;gap:8px">'
        +'<button onclick="confirmModalNo()" style="flex:1">キャンセル</button>'
        +'<button class="btn-primary" onclick="confirmModalYes()" style="flex:1">はい</button>'
        +'</div></div></div>';
    }
    if(S.alertMsg){
      html+='<div class="modal-overlay" onclick="if(event.target===this)closeAlertModal()"><div class="modal" style="max-width:340px">'
        +'<p style="font-size:14px;margin-bottom:18px;text-align:center;white-space:pre-wrap">'+S.alertMsg+'</p>'
        +'<button class="btn-primary" onclick="closeAlertModal()" style="width:100%">OK</button>'
        +'</div></div>';
    }
    return html;
  }

  // ─── アクション ───
  window.downloadCSV=function(){
    var students=getStudents();
    var classesToExport=S.rankingFilterCls==="all"?uniq(students.map(function(s){return s.cls;})):[S.rankingFilterCls];
    var sampleSkills=SKILLS[1];
    // ヘッダー行
    var headers=["クラス","出席番号","性別"];
    sampleSkills.forEach(function(sk,i){headers.push((i+1)+"."+sk.name);});
    headers.push("基本技計(評価用)","合計点","評価");
    var rows=[headers];
    classesToExport.forEach(function(cls){
      // 出席番号順に並べ、欠席などで登録・記録が無い番号は空欄の行にして「飛び」を可視化する
      var clsStudents=students.filter(function(s){return s.cls===cls;});
      var byNum={};
      var maxNum=0;
      clsStudents.forEach(function(s){
        var n=parseInt(s.number,10)||0;
        byNum[n]=s;
        if(n>maxNum)maxNum=n;
      });
      for(var n=1;n<=maxNum;n++){
        var s=byNum[n];
        if(s){
          var sc=DB.scores[s.id]||{};
          var skills=SKILLS[s.grade];
          var total=calcTotal(sc,skills);
          var baseTotal=calcBaseTotal(sc,skills);
          var grade=calcGrade(baseTotal);
          var row=[s.cls,s.number,s.gender];
          skills.forEach(function(sk){
            var hasAny=(sc[sk.id+"_d"]!==undefined||sc[sk.id+"_k"]!==undefined);
            row.push(hasAny?skillTotal(sc,sk):"");
          });
          row.push(baseTotal,total,grade);
          rows.push(row);
        }else{
          var blankRow=[cls,String(n),""];
          sampleSkills.forEach(function(){blankRow.push("");});
          blankRow.push("","","");
          rows.push(blankRow);
        }
      }
    });
    // CSV文字列生成
    var csv="﻿"+rows.map(function(row){
      return row.map(function(cell){
        var s=String(cell==null?"":cell);
        if(s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0){
          s='"'+s.replace(/"/g,'""')+'"';
        }
        return s;
      }).join(",");
    }).join("\n");
    // ダウンロード
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;
    a.download="跳び箱評価_"+(S.rankingFilterCls==="all"?"全クラス":S.rankingFilterCls)+".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  window.doTLogin=function(){
    var email=(document.getElementById("tEmail").value||"").trim();
    var pw=document.getElementById("tpw").value;
    if(!email||!pw){S.tErr="メールアドレスとパスワードを入力してください";render();return;}
    auth.signInWithEmailAndPassword(email,pw).then(function(){

      var known=["auth/wrong-password","auth/user-not-found","auth/invalid-credential","auth/invalid-email"];
      S.tErr=known.indexOf(err.code)>=0?"メールアドレスまたはパスワードが違います":("ログインに失敗しました："+err.message);

  window.openClassModal=function(){S.classModal=true;render();};
  window.closeClassModal=function(){S.classModal=false;render();};
  window.setFilter=function(v){S.filterCls=v;render();};
  window.confirmDel=function(id){S.delConf=id;render();};
  window.cancelDel=function(){S.delConf=null;render();};

    S.selId=id;S.tExpanded=null;
    S.tScores=DB.scores[id]||{};
    render();
  };
  window.toggleGender=function(id,cur){
    dbSet('students/'+id+'/gender',cur==="男子"?"女子":"男子");
  };

  // 教師採点
  window.toggleTExp=function(id){
    var det=document.getElementById("tdetail-"+id);
    if(!det)return;
    var open=det.style.display!=="none";
    if(S.tExpanded&&S.tExpanded!==id){
      var o=document.getElementById("tdetail-"+S.tExpanded);
      if(o)o.style.display="none";
    }
    det.style.display=open?"none":"block";
    S.tExpanded=open?null:id;
    var row=document.getElementById("trow-"+id);
    if(row){var sp=row.querySelectorAll(".skill-header span");var last=sp[sp.length-1];if(last)last.textContent=open?'▼':'▲';}
  };
  window.doTScore=function(skillId,part,pts,label){
    var key=skillId+"_"+part;
    S.tScores[key]={pts:pts,label:label};
    dbSet('scores/'+S.selId+'/'+key,{pts:pts,label:label});
    // DOM更新
    updateTBadge(skillId);updateTSummary();
    var prefix=part==="d"?"tdbtn-":"tkbtn-";
    render({keepScroll:true});
  };
  window.doTReset=function(skillId,part){
    var key=skillId+"_"+part;
    showConfirm("未評価に戻しますか？",'resetScoreT',key);
  };
  function updateTBadge(skillId){
    var sel=DB.students[S.selId];if(!sel)return;
    var sk=SKILLS[sel.grade].filter(function(s){return s.id===skillId;})[0];if(!sk)return;
    var st=skillTotal(S.tScores,sk);
    var has=(S.tScores[skillId+"_d"]!==undefined||S.tScores[skillId+"_k"]!==undefined);
    var b=document.getElementById("tbadge-"+skillId);
    if(b){if(has){b.style.cssText="font-size:12px;font-weight:700;color:#E67E22;background:#FEF3E8;padding:2px 8px;border-radius:12px;border:1px solid #f6c89b";b.textContent=st+"/8点";}
    else{b.style.cssText="font-size:11px;color:#bbb";b.textContent="未評価";}}
  }
  function updateTSummary(){
    var sel=DB.students[S.selId];if(!sel)return;
    var skills=SKILLS[sel.grade],total=calcTotal(S.tScores,skills),baseTotal=calcBaseTotal(S.tScores,skills),grade=calcGrade(baseTotal);
    var done=skills.filter(function(sk){return S.tScores[sk.id+"_d"]!==undefined||S.tScores[sk.id+"_k"]!==undefined;}).length;
    var gc=document.getElementById("sum-grade"),gp=document.getElementById("sum-pts"),gsc=document.getElementById("sum-count"),gb=document.getElementById("sum-base");
    if(gc){gc.textContent=grade;gc.style.cssText=gcStyle(grade)+";width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0";}
    if(gp)gp.innerHTML=total+'<span style="font-size:12px;color:#888;font-weight:400">/88</span>';
    if(gsc)gsc.textContent=done+"/11種目";
    if(gb)gb.textContent="評価判定：基本技 "+baseTotal+"/"+baseMaxOf(skills)+"点（加点技を除く）";
  }

    var row=document.getElementById("srow-"+id);
    if(row){var sp=row.querySelectorAll(".skill-header span");var last=sp[sp.length-1];if(last)last.textContent=open?'▼':'▲';}

  window.doAddStu=function(){
    var num=document.getElementById("nNum").value.trim();
    var cls=document.getElementById("nCls").value;
    var gender=document.getElementById("nGender").value;
    if(!num){showAlert("出席番号を入力してください");return;}
    var id=genId();
    dbSet('students/'+id,{id:id,number:num,cls:cls,grade:gradeFromCls(cls),gender:gender,password:num,isDefault:true},function(){
      S.addOpen=false;render();
    });
  };
  window.doBulkAdd=function(){
    var cls=document.getElementById("bCls").value;
    var start=parseInt(document.getElementById("bStart").value)||1;
    var lines=document.getElementById("bNames").value.split("\n").map(function(n){return n.trim();}).filter(function(n){return n;});
    if(!lines.length){showAlert("性別を1行に1人ずつ入力してください");return;}
    var count=0,total=lines.length;
    lines.forEach(function(line,i){
      var gender=(line==="女"||line==="女子")?"女子":"男子";
      var num=String(start+i);
      var id=genId();
      dbSet('students/'+id,{id:id,number:num,cls:cls,grade:gradeFromCls(cls),gender:gender,password:num,isDefault:true},function(){
        count++;
        if(count===total){S.bulkOpen=false;showAlert(count+"人を追加しました！初期パスワードは出席番号です。");render();}
      });
    });
  };
  window.doDelStu=function(id){
    dbRemove('students/'+id);dbRemove('scores/'+id);
    if(S.selId===id){S.selId=null;S.tScores={};}

  };

    dbSet('classes',DB.classes.concat([v]));

  };
  window.doChangePw=function(){
    var o=document.getElementById("pwOld").value;
    var n=document.getElementById("pwNew").value;
    var n2=document.getElementById("pwNew2").value;
    if(n!==n2){S.pwErr="新しいパスワードが一致しません";render();return;}
    if(n.length<4){S.pwErr="4文字以上にしてください";render();return;}
    if(S.logStu.password!==o){S.pwErr="現在のパスワードが違います";render();return;}
    dbSet('students/'+S.logStu.id+'/password',n);
    dbSet('students/'+S.logStu.id+'/isDefault',false,function(){
      S.logStu=Object.assign({},S.logStu,{password:n,isDefault:false});
      S.pwOk=true;render();
