<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぎょうざ注文フォーム</title>
<style>
  :root {
    --dough: #F3E9D2;
    --dough-dark: #E4D3AA;
    --soy: #4A2E1F;
    --soy-light: #7A5039;
    --chive: #5C7A4A;
    --chive-dark: #3F5833;
    --paper: #FFFBF3;
    --accent: #C4522A;
    --shadow: rgba(74, 46, 31, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--dough);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.4) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(196,82,42,0.06) 0%, transparent 45%);
    color: var(--soy);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    background: var(--soy);
    color: var(--dough);
    padding: 22px 20px 20px;
    position: relative;
    overflow: hidden;
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .gyoza-icon {
    display: inline-block;
    width: 30px;
    height: 20px;
    background: var(--dough);
    border-radius: 0 50% 50% 50%;
    position: relative;
    transform: rotate(-10deg);
    box-shadow: inset 0 -4px 0 rgba(74,46,31,0.15);
  }
  header p {
    margin: 6px 0 0;
    font-size: 0.85rem;
    opacity: 0.75;
  }

  .status-banner {
    text-align: center;
    padding: 10px 16px;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }
  .status-banner.open {
    background: #E4EEDD;
    color: var(--chive-dark);
  }
  .status-banner.closed {
    background: #F3DCD5;
    color: var(--accent);
  }
  .status-banner.unset {
    background: var(--dough-dark);
    color: var(--soy-light);
    font-weight: 600;
    font-size: 0.85rem;
  }

  .deadline-toggle {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--soy-light);
    font-size: 0.78rem;
    padding: 0 0 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .deadline-toggle:hover { color: var(--accent); }
  .deadline-setting {
    display: none;
    background: var(--dough);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .deadline-setting.show { display: block; }
  .deadline-setting input[type=date],
  .deadline-setting select {
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--dough-dark);
    font-size: 0.95rem;
    background: #fff;
    color: var(--soy);
    margin-bottom: 12px;
  }
  .deadline-setting .setting-field { margin-bottom: 4px; }
  .deadline-setting button.btn-small { width: 100%; }

  .tabs {
    display: flex;
    max-width: 640px;
    margin: 18px auto 0;
    padding: 0 16px;
    gap: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: var(--paper);
    color: var(--soy-light);
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 12px 12px 0 0;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .tab-btn.active {
    opacity: 1;
    color: var(--soy);
    box-shadow: 0 -2px 8px var(--shadow);
  }
  .tab-btn:not(.active):hover { opacity: 0.85; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .panel {
    background: var(--paper);
    border-radius: 0 0 16px 16px;
    padding: 20px 18px 26px;
    box-shadow: 0 4px 20px var(--shadow);
  }
  .panel.top-round { border-radius: 16px; margin-top: 18px; }

  .field-label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--soy-light);
    margin-bottom: 6px;
    display: block;
    letter-spacing: 0.03em;
  }

  select, input[type=text] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--dough-dark);
    background: #fff;
    font-size: 1rem;
    color: var(--soy);
  }
  select:focus, input[type=text]:focus, input[type=number]:focus {
    outline: 2px solid var(--chive);
    outline-offset: 1px;
  }

  .teacher-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .teacher-row select { flex: 1; }
  .add-teacher-inline {
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  .add-teacher-inline.show { display: flex; }
  .btn-small {
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: var(--chive);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-small:hover { background: var(--chive-dark); }

  .category {
    margin-bottom: 20px;
  }
  .category-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--accent);
    border-bottom: 2px dashed var(--dough-dark);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #F0E7D3;
    gap: 10px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 0.93rem; font-weight: 600; }
  .item-price { font-size: 0.8rem; color: var(--soy-light); margin-top: 1px; }
  .qty-control {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--chive);
    background: #fff;
    color: var(--chive-dark);
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-btn:hover { background: var(--chive); color: #fff; }
  .qty-input {
    width: 44px;
    text-align: center;
    padding: 6px 2px;
    border-radius: 8px;
    border: 1.5px solid var(--dough-dark);
    font-size: 0.95rem;
  }

  .total-bar {
    position: sticky;
    bottom: 0;
    background: var(--paper);
    border-top: 2px solid var(--dough-dark);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 0 0 16px 16px;
    margin-top: 4px;
  }
  .total-label { font-size: 0.85rem; color: var(--soy-light); }
  .total-amount { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  .submit-btn {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.03em;
    box-shadow: 0 3px 10px rgba(196,82,42,0.35);
  }
  .submit-btn:hover { background: #A8421F; }
  .submit-btn:disabled { background: #C9B79A; cursor: not-allowed; box-shadow: none; }

  .toast {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--chive-dark);
    color: #fff;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.25s ease;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* History panel */
  .summary-box {
    background: var(--dough);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .summary-box h3 {
    margin: 0 0 10px;
    font-size: 0.95rem;
    color: var(--soy);
  }
  table.summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.summary-table th, table.summary-table td {
    text-align: left;
    padding: 6px 4px;
    border-bottom: 1px solid var(--dough-dark);
  }
  table.summary-table th { color: var(--soy-light); font-weight: 700; }
  table.summary-table td.num, table.summary-table th.num { text-align: right; }

  .order-card {
    background: #fff;
    border: 1.5px solid var(--dough-dark);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .order-card .order-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .order-card .teacher-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--soy);
  }
  .order-card .order-time {
    font-size: 0.72rem;
    color: var(--soy-light);
  }
  .order-card ul {
    margin: 0 0 8px;
    padding-left: 18px;
    font-size: 0.87rem;
  }
  .order-card .order-total {
    text-align: right;
    font-weight: 800;
    color: var(--accent);
    font-size: 1rem;
  }
  .delete-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: none;
    border: none;
    color: var(--soy-light);
    font-size: 0.75rem;
    cursor: pointer;
    text-decoration: underline;
  }
  .delete-btn:hover { color: var(--accent); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--soy-light);
    font-size: 0.9rem;
  }
  .empty-state .gyoza-big { font-size: 2.5rem; display: block; margin-bottom: 10px; }

  .reset-all {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: 1px solid var(--soy-light);
    color: var(--soy-light);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .reset-all:hover { border-color: var(--accent); color: var(--accent); }

  .notice {
    font-size: 0.72rem;
    color: var(--soy-light);
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }

  .field-hint {
    font-size: 0.72rem;
    color: var(--soy-light);
    margin: 0 0 12px;
  }
  .split-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .split-row input { flex: 1; }
  .deadline-setting hr {
    border: none;
    border-top: 1px dashed var(--dough-dark);
    margin: 14px 0;
  }
  #cost-split-box select,
  #cost-split-box input[type=number] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--dough-dark);
    background: #fff;
    font-size: 1rem;
    color: var(--soy);
  }
  #cost-split-box .btn-small { width: 100%; margin-top: 4px; }

  .csv-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    margin-bottom: 16px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--chive);
    background: #fff;
    color: var(--chive-dark);
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .csv-btn:hover { background: var(--chive); color: #fff; }

  .cost-note {
    font-size: 0.78rem;
    color: var(--soy-light);
    margin: -4px 0 12px;
  }
  table.summary-table td.share { color: var(--soy-light); }

  .paid-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1.5px solid var(--dough-dark);
    background: #fff;
    color: var(--soy-light);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .paid-toggle.is-paid {
    background: #E4EEDD;
    border-color: var(--chive);
    color: var(--chive-dark);
  }
  .paid-toggle.is-unpaid {
    background: #F3DCD5;
    border-color: var(--accent);
    color: var(--accent);
  }
  .paid-toggle:hover { opacity: 0.85; }
  td.paid-cell { text-align: center; }
  .order-card .order-head { flex-wrap: wrap; row-gap: 6px; }
  .order-card .paid-toggle { margin-left: 8px; }
</style>

<!-- Firebase (GitHub Pages等、Claude以外の場所でホストする場合の共有データ保存に使用) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1><span class="gyoza-icon"></span>ぎょうざ注文フォーム</h1>
  <p>先生方の注文をまとめて集計します</p>
</header>

<div class="status-banner" id="status-banner"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="order">注文する</button>
  <button class="tab-btn" data-tab="history">注文一覧・集計</button>
</div>

<main>
  <!-- ORDER PANEL -->
  <section class="panel" id="panel-order">
    <button class="deadline-toggle" id="deadline-toggle">⚙ 受付状況・日程を設定する（管理用）</button>
    <div class="deadline-setting" id="deadline-setting">
      <div class="setting-field">
        <label class="field-label">受付状況</label>
        <select id="accepting-select">
          <option value="open">🟢 現在受付中</option>
          <option value="closed">🔴 現在は受け付けていません</option>
        </select>
      </div>
      <div class="setting-field">
        <label class="field-label">締切日（表示用）</label>
        <input type="date" id="deadline-input">
      </div>
      <div class="setting-field">
        <label class="field-label">配送日・お届け予定日</label>
        <input type="date" id="delivery-input">
      </div>
      <button class="btn-small" id="btn-save-settings">この内容で設定を保存する</button>
    </div>

    <label class="field-label">先生を選択</label>
    <div class="teacher-row">
      <select id="teacher-select"></select>
      <button class="btn-small" id="btn-new-teacher">＋登録</button>
    </div>
    <div class="add-teacher-inline" id="new-teacher-row">
      <input type="text" id="new-teacher-input" placeholder="お名前を入力（例：山田）">
      <button class="btn-small" id="btn-add-teacher">追加</button>
    </div>

    <div id="items-container"></div>
  </section>

  <div class="panel total-bar" id="total-bar-panel">
    <div>
      <div class="total-label">合計金額</div>
      <div class="total-amount" id="total-amount">¥0</div>
    </div>
  </div>
  <button class="submit-btn" id="submit-btn">この内容で注文を送信する</button>
  <p class="notice">送信内容は「注文一覧・集計」タブで全員が確認できます。</p>

  <!-- HISTORY PANEL -->
  <section class="panel top-round" id="panel-history" style="display:none;">
    <button class="csv-btn" id="csv-download-btn">⬇ 集計をCSVでダウンロード</button>

    <div class="summary-box" id="cost-split-box">
      <h3>送料・箱代を分担する</h3>
      <div class="split-row">
        <input type="number" min="0" id="hist-shipping-input" placeholder="送料（円）">
        <input type="number" min="0" id="hist-box-price-input" placeholder="箱代 1箱（円）">
        <input type="number" min="0" id="hist-box-count-input" placeholder="箱の個数">
      </div>
      <div class="field-hint">合計 ＝ 送料 ＋（箱代 × 箱の個数）を、注文した先生方で分担します。</div>
      <div class="setting-field">
        <label class="field-label">分担方法</label>
        <select id="hist-split-method-select">
          <option value="equal">注文した先生で均等に割る</option>
          <option value="proportional">注文金額に応じて按分する</option>
        </select>
      </div>
      <button class="btn-small" id="hist-calc-btn">この内容で計算する</button>
    </div>

    <div id="history-content"></div>
    <button class="reset-all" id="reset-all-btn">すべての注文をリセットする（担当の先生用）</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const MENU = [
  { category: "ぎょうざ", items: [
    { id: "g50", name: "ぎょうざ 50個入", price: 1550 },
    { id: "g40", name: "ぎょうざ 40個入", price: 1240 },
    { id: "sg50", name: "しょうが入りぎょうざ 50個入", price: 1550 },
    { id: "sg40", name: "しょうが入りぎょうざ 40個入", price: 1240 },
  ]},
  { category: "たれ", items: [
    { id: "t_yaki", name: "焼きぎょうざのたれ", price: 114 },
    { id: "t_miso", name: "ぎょうざのたれ みそ", price: 225 },
    { id: "t_yuzu", name: "ぎょうざのたれ 柚子こしょう", price: 245 },
    { id: "t_hinata", name: "日向夏のたれ（14g×6袋=1セット）", price: 123 },
  ]},
  { category: "スープ・鍋の素", items: [
    { id: "s_mizu", name: "水ぎょうざのスープ", price: 18 },
    { id: "s_nabe", name: "ぎょうざ鍋すうぷ", price: 198 },
    { id: "s_shio", name: "ぎょうざ鍋の素（塩味）", price: 175 },
  ]},
];

let teachers = [];
let orders = [];
let deadline = null; // 'YYYY-MM-DD' or null（表示用の参考情報）
let deliveryDate = null; // 'YYYY-MM-DD' or null
let accepting = 'open'; // 'open' | 'closed'（担当の先生が手動で切り替え）
let shippingFee = 0; // 送料（円）
let boxPrice = 0; // 箱代 1箱あたり（円）
let boxCount = 0; // 箱の個数
let splitMethod = 'equal'; // 'equal' | 'proportional'
let paidStatus = {}; // teacherName -> true(集金済み) / false・未設定(未収金)
let currentQty = {}; // itemId -> qty
let storageWorks = true; // becomes false if persistent storage is unavailable, falls back to local-only

// ===================== ここにFirebaseの設定を貼り付けてください =====================
// Firebaseコンソール > プロジェクトの設定 > マイアプリ で表示される firebaseConfig をそのまま貼り付け
const firebaseConfig = {
  apiKey: "AIzaSyCe1Tk1vfeaPp9AUtTJ29qibN94o9LBYtY",
  authDomain: "gyoza-order-d3a16.firebaseapp.com",
  projectId: "gyoza-order-d3a16",
  storageBucket: "gyoza-order-d3a16.firebasestorage.app",
  messagingSenderId: "589641862175",
  appId: "1:589641862175:web:55f31ab32d68b74e91192a"
};
// ================================================================================

let db = null;
let docRef = null;
let firebaseReady = false;

function initFirebase() {
  if (firebaseConfig.apiKey === "YOUR_API_KEY") {
    console.warn('firebaseConfigが未設定です。上部の firebaseConfig に実際の値を貼り付けてください。');
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection('gyoza').doc('shared');
    firebaseReady = true;
  } catch (e) {
    console.error('Firebase初期化エラー:', e);
    firebaseReady = false;
  }
}

async function saveData() {
  if (!firebaseReady) { storageWorks = false; return false; }
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      await docRef.set({ teachers, orders, deadline, deliveryDate, accepting, shippingFee, boxPrice, boxCount, splitMethod, paidStatus });
      storageWorks = true;
      return true;
    } catch (e) {
      lastErr = e;
    }
    await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
  }
  console.error('saveData failed after retries:', lastErr);
  storageWorks = false;
  return false;
}

async function loadData() {
  if (!firebaseReady) { teachers = []; orders = []; deadline = null; deliveryDate = null; accepting = 'open'; shippingFee = 0; boxPrice = 0; boxCount = 0; splitMethod = 'equal'; paidStatus = {}; return; }
  try {
    const snap = await docRef.get();
    if (snap.exists) {
      const data = snap.data();
      teachers = Array.isArray(data.teachers) ? data.teachers : [];
      orders = Array.isArray(data.orders) ? data.orders : [];
      deadline = typeof data.deadline === 'string' ? data.deadline : null;
      deliveryDate = typeof data.deliveryDate === 'string' ? data.deliveryDate : null;
      accepting = data.accepting === 'closed' ? 'closed' : 'open';
      shippingFee = typeof data.shippingFee === 'number' ? data.shippingFee : 0;
      boxPrice = typeof data.boxPrice === 'number' ? data.boxPrice : 0;
      boxCount = typeof data.boxCount === 'number' ? data.boxCount : 0;
      splitMethod = data.splitMethod === 'proportional' ? 'proportional' : 'equal';
      paidStatus = (data.paidStatus && typeof data.paidStatus === 'object') ? data.paidStatus : {};
    } else {
      teachers = [];
      orders = [];
      deadline = null;
      deliveryDate = null;
      accepting = 'open';
      shippingFee = 0;
      boxPrice = 0;
      boxCount = 0;
      splitMethod = 'equal';
      paidStatus = {};
    }
  } catch (e) {
    console.error('loadData failed:', e);
    teachers = [];
    orders = [];
    deadline = null;
    deliveryDate = null;
    accepting = 'open';
    shippingFee = 0;
    boxPrice = 0;
    boxCount = 0;
    splitMethod = 'equal';
    paidStatus = {};
  }
}

// 他の端末からの更新をリアルタイムで反映（先生選択リストと注文一覧を自動更新）
function subscribeRealtime() {
  if (!firebaseReady) return;
  docRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    teachers = Array.isArray(data.teachers) ? data.teachers : [];
    orders = Array.isArray(data.orders) ? data.orders : [];
    deadline = typeof data.deadline === 'string' ? data.deadline : null;
    deliveryDate = typeof data.deliveryDate === 'string' ? data.deliveryDate : null;
    accepting = data.accepting === 'closed' ? 'closed' : 'open';
    shippingFee = typeof data.shippingFee === 'number' ? data.shippingFee : 0;
    boxPrice = typeof data.boxPrice === 'number' ? data.boxPrice : 0;
    boxCount = typeof data.boxCount === 'number' ? data.boxCount : 0;
    splitMethod = data.splitMethod === 'proportional' ? 'proportional' : 'equal';
    paidStatus = (data.paidStatus && typeof data.paidStatus === 'object') ? data.paidStatus : {};
    renderTeacherSelect();
    renderStatusBanner();
    const historyPanel = document.getElementById('panel-history');
    if (historyPanel && historyPanel.style.display !== 'none') renderHistory();
  }, err => console.error('realtime sync error:', err));
}

const teacherSelect = document.getElementById('teacher-select');
const itemsContainer = document.getElementById('items-container');
const totalAmountEl = document.getElementById('total-amount');
const toastEl = document.getElementById('toast');
const submitBtn = document.getElementById('submit-btn');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function yen(n) { return '¥' + n.toLocaleString('ja-JP'); }

function renderItems() {
  itemsContainer.innerHTML = '';
  MENU.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = cat.category;
    catDiv.appendChild(title);

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${yen(item.price)}</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
          <input class="qty-input" type="number" min="0" value="${currentQty[item.id]||0}" data-id="${item.id}">
          <button class="qty-btn" data-action="inc" data-id="${item.id}">＋</button>
        </div>
      `;
      catDiv.appendChild(row);
    });
    itemsContainer.appendChild(catDiv);
  });

  itemsContainer.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const cur = currentQty[id] || 0;
      if (btn.dataset.action === 'inc') currentQty[id] = cur + 1;
      else currentQty[id] = Math.max(0, cur - 1);
      renderItems();
      updateTotal();
    });
  });
  itemsContainer.querySelectorAll('.qty-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.id;
      let v = parseInt(inp.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      currentQty[id] = v;
      renderItems();
      updateTotal();
    });
  });
}

function findItem(id) {
  for (const cat of MENU) {
    const found = cat.items.find(i => i.id === id);
    if (found) return found;
  }
  return null;
}

function updateTotal() {
  let total = 0;
  Object.keys(currentQty).forEach(id => {
    const qty = currentQty[id] || 0;
    if (qty > 0) {
      const item = findItem(id);
      if (item) total += item.price * qty;
    }
  });
  totalAmountEl.textContent = yen(total);
  return total;
}

function renderTeacherSelect() {
  const prevValue = teacherSelect.value;
  teacherSelect.innerHTML = '<option value="">選択してください</option>' +
    teachers.map(t => `<option value="${t}">${t}</option>`).join('');
  if (teachers.includes(prevValue)) teacherSelect.value = prevValue;
}

function formatDateJP(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function isAcceptingOrders() {
  return accepting !== 'closed';
}

function renderStatusBanner() {
  const banner = document.getElementById('status-banner');
  const infoParts = [];
  if (deadline) infoParts.push(`締切:${formatDateJP(deadline)}`);
  if (deliveryDate) infoParts.push(`お届け予定:${formatDateJP(deliveryDate)}`);
  const infoText = infoParts.length ? `（${infoParts.join(' / ')}）` : '';

  if (isAcceptingOrders()) {
    banner.className = 'status-banner open';
    banner.textContent = `🟢 現在受付中${infoText}`;
    submitBtn.disabled = false;
  } else {
    banner.className = 'status-banner closed';
    banner.textContent = `🔴 現在は受け付けていません${infoText}`;
    submitBtn.disabled = true;
  }
}

document.getElementById('btn-new-teacher').addEventListener('click', () => {

submitBtn.addEventListener('click', async () => {
  if (!isAcceptingOrders()) { showToast('締切を過ぎているため注文できません'); return; }
  const teacher = teacherSelect.value;
  if (!teacher) { showToast('先生を選択してください'); return; }

  const orderedItems = [];
  Object.keys(currentQty).forEach(id => {
    const qty = currentQty[id] || 0;
    if (qty > 0) {
      const item = findItem(id);
      orderedItems.push({ id, name: item.name, price: item.price, qty, subtotal: item.price * qty });
    }
  });
  if (orderedItems.length === 0) { showToast('1つ以上の商品を選択してください'); return; }

  const total = orderedItems.reduce((s, i) => s + i.subtotal, 0);
  const order = {
    id: 'o_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    teacher,
    items: orderedItems,
    total,
    timestamp: new Date().toISOString(),
  };

  submitBtn.disabled = true;
  orders.push(order);
  const ok = await saveData();
  if (ok) {
    showToast(`${teacher}先生の注文を送信しました（${yen(total)}）`);
    currentQty = {};
    renderItems();
    updateTotal();
  } else {
    orders.pop(); // roll back so a retry won't duplicate
    showToast('保存に失敗しました。電波状況を確認し、もう一度送信してください');
  }
  submitBtn.disabled = false;
});

// ----- 送料・箱代の分担計算 -----
function getExtraCost() {
  const cost = (shippingFee || 0) + (boxPrice || 0) * (boxCount || 0);
  return cost > 0 ? cost : 0;
}

// 端数は多い順に1円ずつ配分し、合計が必ずextraCostと一致するようにする
function computeShares(byTeacher, grandTotal) {
  const names = Object.keys(byTeacher);
  const shares = {};
  names.forEach(n => shares[n] = 0);
  const extraCost = getExtraCost();
  if (extraCost <= 0 || names.length === 0) return shares;

  if (splitMethod === 'proportional' && grandTotal > 0) {
    let remainders = [];
    let assigned = 0;
    names.forEach(name => {
      const raw = extraCost * (byTeacher[name].total / grandTotal);
      const floor = Math.floor(raw);
      shares[name] = floor;
      assigned += floor;
      remainders.push({ name, frac: raw - floor });
    });
    let leftover = extraCost - assigned;
    remainders.sort((a, b) => b.frac - a.frac);
    for (let i = 0; i < leftover; i++) {
      shares[remainders[i % remainders.length].name] += 1;
    }
  } else {
    // 均等割り（先生ごとに注文金額に関わらず同額）
    const base = Math.floor(extraCost / names.length);
    let leftover = extraCost - base * names.length;
    names.forEach(name => shares[name] = base);
    for (let i = 0; i < leftover; i++) {
      shares[names[i % names.length]] += 1;
    }
  }
  return shares;
}

// ----- CSVダウンロード -----
function csvEscape(val) {
  const s = String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// FAX注文用紙（ぎょうざの丸岡）と同じ商品の並び順・単位
const FAX_ORDER_LAYOUT = [
  { id: 'g50', unit: 'パック' },
  { id: 'g40', unit: 'パック' },
  { id: 'sg50', unit: 'パック' },
  { id: 'sg40', unit: 'パック' },
  { id: 't_yaki', unit: '本' },
  { id: 's_mizu', unit: '袋' },
  { id: 't_miso', unit: '本' },
  { id: 't_yuzu', unit: '本' },
  { id: 't_hinata', unit: 'セット' },
  { id: 's_nabe', unit: '本' },
  { id: 's_shio', unit: 'セット' },
];

function downloadCSV() {
  if (orders.length === 0) { showToast('まだ注文がありません'); return; }

  const rows = [];

  // セクション1：商品別 集計（FAX注文用紙と同じ商品構成・並び順・単位で合計個数を出力）
  rows.push(['商品別 集計（FAX注文用紙と同じ並び順）']);
  rows.push(['商品名', '単価（円）', '個数', '単位', '小計（円）']);
  const itemTotals = {};
  orders.forEach(o => {
    o.items.forEach(i => {
      if (!itemTotals[i.id]) itemTotals[i.id] = { name: i.name, price: i.price, qty: 0, subtotal: 0 };
      itemTotals[i.id].qty += i.qty;
      itemTotals[i.id].subtotal += i.subtotal;
    });
  });
  FAX_ORDER_LAYOUT.forEach(layout => {
    const item = findItem(layout.id);
    if (!item) return;
    const t = itemTotals[layout.id];
    const qty = t ? t.qty : 0;
    const subtotal = t ? t.subtotal : 0;
    rows.push([item.name, item.price, qty, layout.unit, subtotal]);
  });
  const grandTotal = orders.reduce((s, o) => s + o.total, 0);
  rows.push(['', '', '', '合計', grandTotal]);
  rows.push([]);

  // セクション2：配達希望日・配達時間帯・FAX番号（注文用紙下部と同じ内容）
  const WEEKDAY_JP = ['日', '月', '火', '水', '木', '金', '土'];
  let deliveryDateStr = '　　月　　日　　曜日';
  if (deliveryDate) {
    const d = new Date(deliveryDate + 'T00:00:00');
    deliveryDateStr = `${d.getMonth() + 1}月${d.getDate()}日　${WEEKDAY_JP[d.getDay()]}曜日`;
  }

  rows.push(['配達希望日', deliveryDateStr]);
  rows.push(['配達時間帯', '指定なし　14－16時　16－18時　18時-20時　19-21時']);
  rows.push(['通信欄', '']);
  rows.push([]);
  rows.push(['※配達日はご希望に添えない場合もあります。梱包料・送料を計算し、配達日時など弊社より連絡致します。']);
  rows.push([]);
  rows.push(['FAX', '0986（46）5546']);

  const csvContent = '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date();
  const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `ぎょうざ注文集計_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}

document.getElementById('csv-download-btn').addEventListener('click', downloadCSV);

document.getElementById('hist-calc-btn').addEventListener('click', async () => {
  const shippingVal = parseInt(document.getElementById('hist-shipping-input').value, 10);
  const boxPriceVal = parseInt(document.getElementById('hist-box-price-input').value, 10);
  const boxCountVal = parseInt(document.getElementById('hist-box-count-input').value, 10);
  shippingFee = isNaN(shippingVal) || shippingVal < 0 ? 0 : shippingVal;
  boxPrice = isNaN(boxPriceVal) || boxPriceVal < 0 ? 0 : boxPriceVal;
  boxCount = isNaN(boxCountVal) || boxCountVal < 0 ? 0 : boxCountVal;
  splitMethod = document.getElementById('hist-split-method-select').value === 'proportional' ? 'proportional' : 'equal';

  renderHistory();
  const ok = await saveData();
  showToast(ok ? '計算して保存しました' : '計算しましたが保存に失敗しました');
});

// ----- History -----
function renderHistory() {
  const container = document.getElementById('history-content');
  if (orders.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="gyoza-big">🥟</span>まだ注文がありません</div>`;
    return;
  }

  // Per-teacher summary
  const byTeacher = {};
  orders.forEach(o => {
    if (!byTeacher[o.teacher]) byTeacher[o.teacher] = { count: 0, total: 0 };
    const qtySum = o.items.reduce((s, i) => s + i.qty, 0);
    byTeacher[o.teacher].count += qtySum;
    byTeacher[o.teacher].total += o.total;
  });
  const grandTotal = orders.reduce((s, o) => s + o.total, 0);
  const shares = computeShares(byTeacher, grandTotal);
  const extraCost = getExtraCost();

  let extraCostNote = '';
  if (extraCost > 0) {
    const methodLabel = splitMethod === 'proportional' ? '注文金額に応じて按分' : '注文した先生で均等割り';
    extraCostNote = `<div class="cost-note">送料・箱代の合計 ${yen(extraCost)}（送料 ${yen(shippingFee)} ＋ 箱代 ${yen(boxPrice)} × ${boxCount}箱）を、${methodLabel}で下表に反映しています。</div>`;
  }

  let html = `<div class="summary-box">
    <h3>先生別 集計</h3>
    ${extraCostNote}
    <table class="summary-table">
      <thead><tr><th>先生</th><th class="num">個数合計</th><th class="num">注文金額</th>${extraCost > 0 ? '<th class="num">送料・箱代</th><th class="num">お支払い合計</th>' : ''}<th>集金状況</th></tr></thead>
      <tbody>
        ${Object.keys(byTeacher).map(name => `
          <tr><td>${name}</td><td class="num">${byTeacher[name].count}</td><td class="num">${yen(byTeacher[name].total)}</td>${extraCost > 0 ? `<td class="num share">${yen(shares[name])}</td><td class="num"><strong>${yen(byTeacher[name].total + shares[name])}</strong></td>` : ''}<td class="paid-cell"><button class="paid-toggle ${paidStatus[name] ? 'is-paid' : 'is-unpaid'}" data-teacher="${name}">${paidStatus[name] ? '✔ 集金済み' : '未収金'}</button></td></tr>
        `).join('')}
      </tbody>
      <tfoot><tr><td><strong>合計</strong></td><td></td><td class="num"><strong>${yen(grandTotal)}</strong></td>${extraCost > 0 ? `<td class="num"><strong>${yen(extraCost)}</strong></td><td class="num"><strong>${yen(grandTotal + extraCost)}</strong></td>` : ''}<td></td></tr></tfoot>
    </table>
  </div>`;

  // Individual order cards, newest first
  const sorted = [...orders].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  html += sorted.map(o => {
    const date = new Date(o.timestamp);
    const dateStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    return `<div class="order-card">
      <button class="delete-btn" data-id="${o.id}">削除</button>
      <div class="order-head">
        <span class="teacher-name">${o.teacher} 先生</span>
        <button class="paid-toggle ${paidStatus[o.teacher] ? 'is-paid' : 'is-unpaid'}" data-teacher="${o.teacher}">${paidStatus[o.teacher] ? '✔ 集金済み' : '未収金'}</button>
        <span class="order-time">${dateStr}</span>
      </div>
      <ul>
        ${o.items.map(i => `<li>${i.name} × ${i.qty}　${yen(i.subtotal)}</li>`).join('')}
      </ul>
      <div class="order-total">${yen(o.total)}</div>
    </div>`;
  }).join('');

  container.innerHTML = html;

  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('この注文を削除しますか？')) return;
      const id = btn.dataset.id;
      const backup = orders;
      orders = orders.filter(o => o.id !== id);
      const ok = await saveData();
      if (ok) {
        renderHistory();
        showToast('注文を削除しました');
      } else {
        orders = backup;
        showToast('削除に失敗しました。もう一度お試しください');
      }
    });
  });

  container.querySelectorAll('.paid-toggle').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.teacher;
      const backup = { ...paidStatus };
      paidStatus = { ...paidStatus, [name]: !paidStatus[name] };
      renderHistory();
      const ok = await saveData();
      if (!ok) {
        paidStatus = backup;
        renderHistory();
        showToast('集金状況の保存に失敗しました。もう一度お試しください');
      }
    });
  });
}

document.getElementById('reset-all-btn').addEventListener('click', async () => {
  if (!confirm('全ての注文履歴を削除します。よろしいですか？（この操作は元に戻せません）')) return;
  const backup = orders;
  orders = [];
  const ok = await saveData();
  if (ok) {
    renderHistory();
    showToast('全ての注文をリセットしました');
  } else {
    orders = backup;
    showToast('リセットに失敗しました。もう一度お試しください');
  }
});

// ----- Init -----
async function init() {
  initFirebase();
  if (!firebaseReady) {
    showToast('⚠️ firebaseConfigが未設定です。コード上部に貼り付けてください');
  } else {
    subscribeRealtime();
  }
  await loadData();
  renderTeacherSelect();
  renderStatusBanner();
  renderItems();
  updateTotal();
}
init();
