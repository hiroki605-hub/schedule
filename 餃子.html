<script>
const MENU = [
  { category: "ぎょうざ", items: [
    { id: "g50", name: "ぎょうざ 50個入", price: 1550 },
    { id: "g40", name: "ぎょうざ 40個入", price: 1240 },
    { id: "sg50", name: "しょうが入りぎょうざ 50個入", price: 1550 },
    { id: "sg40", name: "しょうが入りぎょうざ 40個入", price: 1240 },
  ]},
  { category: "たれ", items: [
    { id: "t_yaki", name: "焼きぎょうざのたれ", price: 114 },
    { id: "t_miso", name: "ぎょうざのたれ みそ", price: 225 },
    { id: "t_yuzu", name: "ぎょうざのたれ 柚子こしょう", price: 245 },
    { id: "t_hinata", name: "日向夏のたれ（14g×6袋=1セット）", price: 123 },
  ]},
  { category: "スープ・鍋の素", items: [
    { id: "s_mizu", name: "水ぎょうざのスープ", price: 18 },
    { id: "s_nabe", name: "ぎょうざ鍋すうぷ", price: 198 },
    { id: "s_shio", name: "ぎょうざ鍋の素（塩味）", price: 175 },
  ]},
];

let teachers = [];
let orders = [];
let deadline = null; 
let deliveryDate = null; 
let accepting = 'open'; 
let sharedFee = 0; // 配送料・箱代の合計
let currentQty = {}; 
let storageWorks = true; 

// ===================== Firebase =====================
const firebaseConfig = {
  apiKey: "AIzaSyCe1Tk1vfeaPp9AUtTJ29qibN94o9LBYtY",
  authDomain: "gyoza-order-d3a16.firebaseapp.com",
  projectId: "gyoza-order-d3a16",
  storageBucket: "gyoza-order-d3a16.firebasestorage.app",
  messagingSenderId: "589641862175",
  appId: "1:589641862175:web:55f31ab32d68b74e91192a"
};

let db = null;
let docRef = null;
let firebaseReady = false;

function initFirebase() {
  if (firebaseConfig.apiKey === "YOUR_API_KEY") return;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection('gyoza').doc('shared');
    firebaseReady = true;
  } catch (e) {
    console.error('Firebase初期化エラー:', e);
    firebaseReady = false;
  }
}

async function saveData() {
  if (!firebaseReady) { storageWorks = false; return false; }
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      await docRef.set({ teachers, orders, deadline, deliveryDate, accepting, sharedFee });
      storageWorks = true;
      return true;
    } catch (e) {
      lastErr = e;
    }
    await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
  }
  console.error('saveData failed:', lastErr);
  storageWorks = false;
  return false;
}

async function loadData() {
  if (!firebaseReady) return;
  try {
    const snap = await docRef.get();
    if (snap.exists) {
      const data = snap.data();
      teachers = Array.isArray(data.teachers) ? data.teachers : [];
      orders = Array.isArray(data.orders) ? data.orders : [];
      deadline = typeof data.deadline === 'string' ? data.deadline : null;
      deliveryDate = typeof data.deliveryDate === 'string' ? data.deliveryDate : null;
      accepting = data.accepting === 'closed' ? 'closed' : 'open';
      sharedFee = typeof data.sharedFee === 'number' ? data.sharedFee : 0;
    }
  } catch (e) {
    console.error('loadData failed:', e);
  }
}

function subscribeRealtime() {
  if (!firebaseReady) return;
  docRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    teachers = Array.isArray(data.teachers) ? data.teachers : [];
    orders = Array.isArray(data.orders) ? data.orders : [];
    deadline = typeof data.deadline === 'string' ? data.deadline : null;
    deliveryDate = typeof data.deliveryDate === 'string' ? data.deliveryDate : null;
    accepting = data.accepting === 'closed' ? 'closed' : 'open';
    sharedFee = typeof data.sharedFee === 'number' ? data.sharedFee : 0;
    
    renderTeacherSelect();
    renderStatusBanner();
    const historyPanel = document.getElementById('panel-history');
    if (historyPanel && historyPanel.style.display !== 'none') renderHistory();
  }, err => console.error('realtime sync error:', err));
}

const teacherSelect = document.getElementById('teacher-select');
const itemsContainer = document.getElementById('items-container');
const totalAmountEl = document.getElementById('total-amount');
const toastEl = document.getElementById('toast');
const submitBtn = document.getElementById('submit-btn');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function yen(n) { return '¥' + (n||0).toLocaleString('ja-JP'); }

function renderItems() {
  itemsContainer.innerHTML = '';
  MENU.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = cat.category;
    catDiv.appendChild(title);

    cat.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${yen(item.price)}</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
          <input class="qty-input" type="number" min="0" value="${currentQty[item.id]||0}" data-id="${item.id}">
          <button class="qty-btn" data-action="inc" data-id="${item.id}">＋</button>
        </div>
      `;
      catDiv.appendChild(row);
    });
    itemsContainer.appendChild(catDiv);
  });

  itemsContainer.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const cur = currentQty[id] || 0;
      if (btn.dataset.action === 'inc') currentQty[id] = cur + 1;
      else currentQty[id] = Math.max(0, cur - 1);
      renderItems();
      updateTotal();
    });
  });
  itemsContainer.querySelectorAll('.qty-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = inp.dataset.id;
      let v = parseInt(inp.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      currentQty[id] = v;
      renderItems();
      updateTotal();
    });
  });
}

function findItem(id) {
  for (const cat of MENU) {
    const found = cat.items.find(i => i.id === id);
    if (found) return found;
  }
  return null;
}

function updateTotal() {
  let total = 0;
  Object.keys(currentQty).forEach(id => {
    const qty = currentQty[id] || 0;
    if (qty > 0) {
      const item = findItem(id);
      if (item) total += item.price * qty;
    }
  });
  totalAmountEl.textContent = yen(total);
  return total;
}

function renderTeacherSelect() {
  const prevValue = teacherSelect.value;
  teacherSelect.innerHTML = '<option value="">選択してください</option>' +
    teachers.map(t => `<option value="${t}">${t}</option>`).join('');
  if (teachers.includes(prevValue)) teacherSelect.value = prevValue;
}

function formatDateJP(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function isAcceptingOrders() {
  return accepting !== 'closed';
}

function renderStatusBanner() {
  const banner = document.getElementById('status-banner');
  const infoParts = [];
  if (deadline) infoParts.push(`締切:${formatDateJP(deadline)}`);
  if (deliveryDate) infoParts.push(`お届け予定:${formatDateJP(deliveryDate)}`);
  const infoText = infoParts.length ? `（${infoParts.join(' / ')}）` : '';

  if (isAcceptingOrders()) {
    banner.className = 'status-banner open';
    banner.textContent = `🟢 現在受付中${infoText}`;
    submitBtn.disabled = false;
  } else {
    banner.className = 'status-banner closed';
    banner.textContent = `🔴 現在は受け付けていません${infoText}`;
    submitBtn.disabled = true;
  }
}

document.getElementById('deadline-toggle').addEventListener('click', () => {
  const row = document.getElementById('deadline-setting');
  row.classList.toggle('show');
  if (row.classList.contains('show')) {
    document.getElementById('accepting-select').value = accepting;
    if (deadline) document.getElementById('deadline-input').value = deadline;
    if (deliveryDate) document.getElementById('delivery-input').value = deliveryDate;
    document.getElementById('fee-input').value = sharedFee || '';
  }
});

document.getElementById('btn-save-settings').addEventListener('click', async () => {
  accepting = document.getElementById('accepting-select').value === 'closed' ? 'closed' : 'open';
  const deadlineVal = document.getElementById('deadline-input').value;
  const deliveryVal = document.getElementById('delivery-input').value;
  deadline = deadlineVal || null;
  deliveryDate = deliveryVal || null;
  sharedFee = parseInt(document.getElementById('fee-input').value, 10) || 0;
  
  renderStatusBanner();
  const ok = await saveData();
  showToast(ok ? '設定を保存しました' : '設定の保存に失敗しました');
});

document.getElementById('btn-new-teacher').addEventListener('click', () => {
  const row = document.getElementById('new-teacher-row');
  row.classList.toggle('show');
  if (row.classList.contains('show')) document.getElementById('new-teacher-input').focus();
});

document.getElementById('btn-add-teacher').addEventListener('click', async () => {
  const input = document.getElementById('new-teacher-input');
  const name = input.value.trim();
  if (!name) return;
  if (teachers.includes(name)) {
    showToast('その名前はすでに登録されています');
    return;
  }
  teachers.push(name);
  renderTeacherSelect();
  teacherSelect.value = name;
  input.value = '';
  document.getElementById('new-teacher-row').classList.remove('show');
  const ok = await saveData();
  showToast(ok ? `「${name}」先生を登録しました` : `保存に失敗しました`);
});

submitBtn.addEventListener('click', async () => {
  if (!isAcceptingOrders()) { showToast('締切を過ぎているため注文できません'); return; }
  const teacher = teacherSelect.value;
  if (!teacher) { showToast('先生を選択してください'); return; }

  const orderedItems = [];
  Object.keys(currentQty).forEach(id => {
    const qty = currentQty[id] || 0;
    if (qty > 0) {
      const item = findItem(id);
      orderedItems.push({ id, name: item.name, price: item.price, qty, subtotal: item.price * qty });
    }
  });
  if (orderedItems.length === 0) { showToast('1つ以上の商品を選択してください'); return; }

  const total = orderedItems.reduce((s, i) => s + i.subtotal, 0);
  const order = {
    id: 'o_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    teacher,
    items: orderedItems,
    total,
    timestamp: new Date().toISOString(),
  };

  submitBtn.disabled = true;
  orders.push(order);
  const ok = await saveData();
  if (ok) {
    showToast(`${teacher}先生の注文を送信しました`);
    currentQty = {};
    renderItems();
    updateTotal();
  } else {
    orders.pop(); 
    showToast('保存に失敗しました。もう一度送信してください');
  }
  submitBtn.disabled = false;
});

// ----- Tabs -----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('panel-order').style.display = tab === 'order' ? 'block' : 'none';
    document.getElementById('total-bar-panel').style.display = tab === 'order' ? 'flex' : 'none';
    submitBtn.style.display = tab === 'order' ? 'block' : 'none';
    document.querySelector('.notice').style.display = tab === 'order' ? 'block' : 'none';
    document.getElementById('panel-history').style.display = tab === 'history' ? 'block' : 'none';
    if (tab === 'history') renderHistory();
  });
});

// ----- History -----
function renderHistory() {
  const container = document.getElementById('history-content');
  if (orders.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="gyoza-big">🥟</span>まだ注文がありません</div>`;
    return;
  }

  // Per-teacher summary
  const byTeacher = {};
  orders.forEach(o => {
    if (!byTeacher[o.teacher]) byTeacher[o.teacher] = { count: 0, total: 0 };
    const qtySum = o.items.reduce((s, i) => s + i.qty, 0);
    byTeacher[o.teacher].count += qtySum;
    byTeacher[o.teacher].total += o.total;
  });
  
  const uniqueTeachers = Object.keys(byTeacher).length;
  // 配送料・箱代の割り勘（人数で割って切り上げ）
  const feePerTeacher = uniqueTeachers > 0 ? Math.ceil(sharedFee / uniqueTeachers) : 0;
  const grandTotalItems = orders.reduce((s, o) => s + o.total, 0);
  const grandTotal = grandTotalItems + sharedFee;

  let html = `<div class="summary-box">
    <h3>先生別 集計</h3>
    <div style="font-size:0.75rem; color:#7A5039; margin-bottom:10px;">※配送料等(${yen(sharedFee)})を ${uniqueTeachers}人で割った金額（${yen(feePerTeacher)}）が加算されています</div>
    <table class="summary-table">
      <thead><tr><th>先生</th><th class="num">個数</th><th class="num">商品代</th><th class="num">送料等</th><th class="num">合計</th></tr></thead>
      <tbody>
        ${Object.keys(byTeacher).map(name => `
          <tr>
            <td>${name}</td>
            <td class="num">${byTeacher[name].count}</td>
            <td class="num">${yen(byTeacher[name].total)}</td>
            <td class="num">${yen(feePerTeacher)}</td>
            <td class="num" style="font-weight:bold; color:#C4522A;">${yen(byTeacher[name].total + feePerTeacher)}</td>
          </tr>
        `).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td><strong>総合計</strong></td>
          <td></td>
          <td class="num">${yen(grandTotalItems)}</td>
          <td class="num">${yen(sharedFee)}</td>
          <td class="num" style="font-weight:bold; color:#C4522A;">${yen(grandTotal)}</td>
        </tr>
      </tfoot>
    </table>
    <button class="submit-btn" id="btn-export-csv" style="padding: 10px; font-size: 0.95rem; margin-top: 16px;">📥 お店用 注文まとめをCSV出力</button>
  </div>`;

  // Individual order cards, newest first
  const sorted = [...orders].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  html += sorted.map(o => {
    const date = new Date(o.timestamp);
    const dateStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    return `<div class="order-card">
      <button class="delete-btn" data-id="${o.id}">削除</button>
      <div class="order-head">
        <span class="teacher-name">${o.teacher} 先生</span>
        <span class="order-time">${dateStr}</span>
      </div>
      <ul>
        ${o.items.map(i => `<li>${i.name} × ${i.qty} ${yen(i.subtotal)}</li>`).join('')}
      </ul>
      <div class="order-total">${yen(o.total)}</div>
    </div>`;
  }).join('');

  container.innerHTML = html;

  // 削除ボタン
  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('この注文を削除しますか？')) return;
      const id = btn.dataset.id;
      const backup = orders;
      orders = orders.filter(o => o.id !== id);
      const ok = await saveData();
      if (ok) {
        renderHistory();
        showToast('注文を削除しました');
      } else {
        orders = backup;
        showToast('削除に失敗しました。もう一度お試しください');
      }
    });
  });

  // CSV出力ボタン
  const csvBtn = document.getElementById('btn-export-csv');
  if (csvBtn) {
    csvBtn.addEventListener('click', () => {
      // 合計をIDごとに集計
      const totals = {};
      orders.forEach(o => o.items.forEach(i => {
        totals[i.id] = (totals[i.id] || 0) + i.qty;
      }));

      // CSV生成 (BOM付きでExcelの文字化け防止)
      let csv = '\uFEFF商品名,個数,単位\n';
      
      // 写真と同じ並び順・表記のマッピング
      const rows = [
        { id: "g50", label: "ぎょうざ 50個入 （税込 1,550円）", unit: "パック" },
        { id: "g40", label: "ぎょうざ 40個入 （税込 1,240円）", unit: "パック" },
        { id: "sg50", label: "しょうが入り餃子 50個入 （税込 1,550円）", unit: "パック" },
        { id: "sg40", label: "しょうが入り餃子 40個入 （税込 1,240円）", unit: "パック" },
        { id: "t_yaki", label: "焼きぎょうざのたれ （税込 114円）", unit: "本" },
        { id: "s_mizu", label: "水ぎょうざのスープ （税込 18円）", unit: "袋" },
        { id: "t_miso", label: "ぎょうざのたれ みそ （税込 225円）", unit: "本" },
        { id: "t_yuzu", label: "ぎょうざのたれ 柚子こしょう （税込 245円）", unit: "本" },
        { id: "t_hinata", label: "日向夏のたれ【14g×6袋】 （税込 123円）", unit: "セット" },
        { id: "s_nabe", label: "餃子鍋すうぷ （税込 198円）", unit: "本" },
        { id: "s_shio", label: "ぎょうざ鍋の素【塩味】 （税込 175円）", unit: "セット" }
      ];

      rows.forEach(r => {
        const q = totals[r.id] || ''; // 個数0の時は空欄にする
        csv += `"${r.label}",${q},${r.unit}\n`;
      });

      // フォーム下部の配達希望日等の欄を追加
      csv += '\n配達希望日,  月  日,曜日\n';
      csv += '配達時間帯,指定なし 14-16時 16-18時 18時-20時 19-21時,\n';
      csv += '通信欄,,\n';

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '丸岡ぎょうざ_お店用注文まとめ.csv';
      a.click();
      URL.revokeObjectURL(url);
    });
  }
}

document.getElementById('reset-all-btn').addEventListener('click', async () => {
  if (!confirm('全ての注文履歴を削除します。よろしいですか？（この操作は元に戻せません）')) return;
  const backup = orders;
  orders = [];
  const ok = await saveData();
  if (ok) {
    renderHistory();
    showToast('全ての注文をリセットしました');
  } else {
    orders = backup;
    showToast('リセットに失敗しました。もう一度お試しください');
  }
});

async function init() {
  initFirebase();
  if (!firebaseReady) {
    showToast('⚠️ firebaseConfigが未設定です。');
  } else {
    subscribeRealtime();
