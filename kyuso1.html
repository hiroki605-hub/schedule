<div id="sync">🔄 Firebase に接続中...</div><div id="app"></div>
<script>
window.addEventListener('load',function(){var l=['app','database','auth'],i=0;(function nx(){if(i>=3){init();return;}var s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-'+l[i++]+'-compat.js';s.onload=nx;document.head.appendChild(s);})();});
function init(){
var fb=firebase.initializeApp({
    apiKey:"AIzaSyB4EcKVsb7wuhjZrUeXEG8vi5c1_2yvGj0",
    authDomain:"schedule-7db64.firebaseapp.com",
    databaseURL:"https://schedule-7db64-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"schedule-7db64",
    storageBucket:"schedule-7db64.firebasestorage.app",
    messagingSenderId:"745424328407",
    appId:"1:745424328407:web:4c8cb8ff701350381d8292"
  },'kyuso1'),db=firebase.database(fb),auth=firebase.auth(fb),teacher=false;
var DB={classes:[],students:{},rec:{},settings:{}};
var S={page:'home',tErr:'',sErr:'',sCls:'',me:null,cls:'',modal:null,ses:0,run:'',M:null,sel:{},setOpen:false,rosOpen:false,hold:0};
function fail(e){if(!e)return;uiAlert(e.code==='PERMISSION_DENIED'?'保存できませんでした。\n・生徒：記録は保存から5分たつと変更できません。先生に直してもらってください。\n・先生：ログインが切れていたら、ログインし直してください。':'保存できませんでした：'+e.message);}
function set(p,v,cb){db.ref('kyuso1/'+p).set(v,cb||fail);}
function rm(p){db.ref('kyuso1/'+p).remove(fail);}
var TS=firebase.database.ServerValue.TIMESTAMP;
function $(id){return document.getElementById(id);}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i;});}
// ── 設定 ──
function cfg(){var s=DB.settings||{};return{track:+s.track||150,n:Math.max(2,+s.n||6),k:+s.k||4,min:+s.min||10,factor:+s.factor||90,cur:+s.cur||1,lv:(s.lv==='easy'||s.lv==='hard')?s.lv:'normal'};}
function typ(i,n){return(i===1||i===n)?'time':'run';}
function dist(g){var w=cfg().track===200;return g==='f'?(w?1500:1000):(w?2000:1500);} // 150m:男1500/女1000、200m:男2000/女1500
function plan(g,tr){var d=dist(g),r=d%tr,f=r===0?tr:r;return{first:f,n:(d-f)/tr+1};}
// 全国平均(R6 体力・運動能力調査)に基づく5段階の上限秒（5点,4点,3点,2点）。男子1500m・女子1000m
var BND={m:{1:[333,392,453,513],2:[311,362,416,468],3:[297,350,404,458]},f:{1:[248,290,334,377],2:[235,276,319,360],3:[231,272,315,357]}};
var IMP=[45,40,35,30,25,20,15,10,5]; // 短縮秒の下限（10点,9点,…,2点）。150mトラック用。これ未満（悪化も含む）は1点
// 200mトラック用：全国調査に男子2000m・女子1500mが無いので、150m用（男1500/女1000）をリーゲル式 T2=T1×(D2/D1)^RG で距離換算した推定値
var RG=1.06;
function scaleF(g){return cfg().track===200?Math.pow(g==='f'?1.5:4/3,RG):1;}
var LV={easy:{t:1.10,i:0.7},normal:{t:1,i:1},hard:{t:0.90,i:1.3}}; // 評価の厳しさ（t=基準タイムの倍率、i=短縮秒数の倍率）
function bnd(g,y){var b=BND[g][y],f=scaleF(g)*LV[cfg().lv].t;return f===1?b:b.map(function(x){return Math.round(x*f);});}
function lvTxt(){var l=cfg().lv;return l==='easy'?'・優しい設定':l==='hard'?'・厳しい設定':'';}
function impTh(g){var f=scaleF(g),k=LV[cfg().lv].i;return (f===1&&k===1)?IMP:IMP.map(function(x){return Math.max(1,Math.round(x*f*k));});}
function yrOf(c){var m=(c||'').match(/[1-3１-３]/);return m?('123'.indexOf(m[0])>=0?+m[0]:'１２３'.indexOf(m[0])+1):1;}
function gOf(s){return s&&s.gender==='f'?'f':'m';}
function tScore(t,y,g){var b=bnd(g,y);for(var i=0;i<4;i++)if(t<b[i]+1)return 5-i;return 1;}
function rScore(d,y,g,c){var b=bnd(g,y);for(var i=0;i<4;i++)if(d>=dist(g)/b[i]*c.min*60*c.factor/100)return 5-i;return 1;}
function iScore(x,g){var m=impTh(g);for(var i=0;i<m.length;i++)if(x>=m[i])return 10-i;return 1;}
function r1(x){return Math.round(x*10)/10;}
function fmt(t,tenth){if(t==null)return'';var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
function hw(v){return String(v).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/：/g,':').replace(/[．。]/g,'.');}
function parseT(v){v=hw(v||'').trim();if(!v)return null;var p=v.split(':'),t=p.length>1?(+p[0])*60+(+p[1]):+p[0];return isFinite(t)&&t>0?r1(t):NaN;}
function calc(s){
  var c=cfg(),r=DB.rec[s.id]||{},y=yrOf(s.cls),g=gOf(s),o={};
  var last=null;for(var i=1;i<=c.n;i++)if(typ(i,c.n)==='time'&&r[i]&&r[i].t)last=r[i];
  o.timePt=last?tScore(last.t,y,g):null;
  o.imp=(r[1]&&r[1].t&&r[c.n]&&r[c.n].t)?r1(r[1].t-r[c.n].t):null;
  o.impPt=o.imp==null?null:iScore(o.imp,g);
  var runs=[];for(var j=2;j<c.n;j++)runs.push(j);runs=runs.slice(-c.k);
  var sc=[];runs.forEach(function(j){if(r[j]&&r[j].laps!=null)sc.push(rScore(r[j].laps*c.track,y,g,c));});
  o.runPt=sc.length?r1(sc.reduce(function(a,b){return a+b;},0)/sc.length):null;
  o.total=r1((o.timePt||0)+(o.impPt||0)+(o.runPt||0));
  return o;
}
function students(){return Object.keys(DB.students).map(function(k){return DB.students[k];}).sort(function(a,b){return a.cls.localeCompare(b.cls)||a.number-b.number;});}
window.S=S;window.render=render;window.set=set;
// ── 生徒ログイン ON/OFF（教師が切り替え） ──
function isStuLocked(){return !!(DB.settings&&DB.settings.studentLocked===true);}
function lockBtn(){var l=isStuLocked();
  return '<button onclick="toggleStudentLock()" style="font-weight:600;'+(l?'background:#fce8e6;border-color:#f4b4ae;color:#d93025':'background:#e6f4ea;border-color:#a8d5b5;color:#1e7e34')+'">'+(l?'🔒 生徒ログイン：停止中（タップで再開）':'🔓 生徒ログイン：許可中（タップで停止）')+'</button>';}
function vLocked(){return '<div style="max-width:380px;margin:0 auto;padding:2rem 1.5rem">'+back('← 戻る','home')
  +'<div style="text-align:center;padding:2rem 1rem;background:#fce8e6;border:1px solid #f4b4ae;border-radius:12px"><div style="font-size:40px;margin-bottom:8px">🔒</div>'
  +'<h2 style="font-size:18px;margin-bottom:6px;color:#d93025">今はログインできません</h2>'
  +'<p style="font-size:13px;color:#888;line-height:1.7">先生がログインを停止しています。<br>先生の指示があるまで待ってください。</p></div></div>';}
window.toggleStudentLock=function(){var next=!isStuLocked();
  var run=function(){set('settings/studentLocked',next);};
  if(next)uiConfirm('生徒のログインを停止しますか？\n（停止中は生徒が新しくログインできなくなります）',run);else run();};
window.goT=function(){go(teacher?'teacher':'tlogin');};
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
// ── 描画 ──
function render(){
  var h='';
  if(S.page==='home')h=vHome();else if(S.page==='tlogin')h=vTLogin();else if(S.page==='teacher')h=vTeacher();
  else if(S.page==='slogin')h=vSLogin();else if(S.page==='pick')h=vPick();else if(S.page==='measure')h=vMeasure();else if(S.page==='mine')h=vMine();
  if(S.modal)h+='<div class="ov"><div><p style="margin-bottom:18px;line-height:1.6;white-space:pre-line">'+esc(S.modal.msg)+'</p><div class="row" style="justify-content:flex-end">'+(S.modal.ok?'<button onclick="mCancel()">キャンセル</button>':'')+'<button class="bp" onclick="mOk()">OK</button></div></div></div>';
  var tw=$('tw'),sp=tw?[tw.scrollTop,tw.scrollLeft]:null;$('app').innerHTML=h;tw=$('tw');if(sp&&tw){tw.scrollTop=sp[0];tw.scrollLeft=sp[1];}
}
window.uiAlert=function(m){S.modal={msg:m};render();};
window.uiConfirm=function(m,f){S.modal={msg:m,ok:f};render();};
window.mOk=function(){var m=S.modal;S.modal=null;if(m&&m.ok)m.ok();render();};
window.mCancel=function(){S.modal=null;render();};
window.go=function(p){if(S.M&&S.M.running&&S.page==='measure')return;S.page=p;S.tErr=S.sErr='';render();};
function back(t,p){return '<button onclick="go(\''+p+'\')" style="border:none;background:none;color:#888;padding:0 0 14px">'+t+'</button>';}
function vHome(){var c=cfg();
  return '<div style="max-width:440px;margin:0 auto;padding:2rem 1.5rem"><p style="font-size:12px;color:#999">体育</p><h1 style="font-size:22px;margin:4px 0">🏃 持久走 記録アプリ</h1>'
  +'<p style="color:#999;font-size:13px;margin-bottom:18px">トラック '+c.track+'m ／ 男子'+dist('m')+'m・女子'+dist('f')+'m ／ 全'+c.n+'回</p>'
  +'<button onclick="go(\'slogin\')" style="width:100%;padding:16px;text-align:left;margin-bottom:10px"><b>⏱ 生徒モード</b><div style="font-size:11px;color:#aaa;margin-top:3px">'+(isStuLocked()?'🔒 現在ログイン停止中':'ペアの記録をとる（ログイン）')+'</div></button>'
  +'<button onclick="goT()" style="width:100%;padding:16px;text-align:left"><b>📋 教師モード</b><div style="font-size:11px;color:#aaa;margin-top:3px">設定・記録の確認と修正・CSV</div></button></div>';}
function vTLogin(){return '<div style="max-width:360px;margin:0 auto;padding:2rem 1.5rem">'+back('← 戻る','home')+'<h2 style="margin-bottom:14px">教師ログイン</h2><div style="display:flex;flex-direction:column;gap:10px"><input type="email" id="te" placeholder="メールアドレス"><input type="password" id="tp" placeholder="パスワード" onkeydown="if(event.key===\'Enter\')tLogin()">'+(S.tErr?'<p style="color:#d93025;font-size:13px">'+S.tErr+'</p>':'')+'<button class="bp" onclick="tLogin()">ログイン</button></div></div>';}
window.tLogin=function(){auth.signInWithEmailAndPassword($('te').value.trim(),$('tp').value).then(function(){S.page='teacher';render();}).catch(function(e){S.tErr='ログインに失敗しました';render();});};
window.tLogout=function(){auth.signOut().then(function(){teacher=false;go('home');});};
// ── 教師 ──
function viewList(){var a=students();return S.cls?a.filter(function(s){return s.cls===S.cls;}):a;}
function selIds(){return viewList().filter(function(s){return S.sel[s.id];}).map(function(s){return s.id;});}
function sc4(s){var o=calc(s),none=o.timePt==null&&o.impPt==null&&o.runPt==null;
  return{tp:nz(o.timePt),im:nz(o.imp),ip:nz(o.impPt),rp:nz(o.runPt),tt:none?nz(null):o.total};}
function refreshCalc(){var c=cfg();[].forEach.call(document.querySelectorAll('tr[data-s]'),function(tr){var s=DB.students[tr.dataset.s];if(!s)return;var x=sc4(s),r=DB.rec[s.id]||{};
  [].forEach.call(tr.querySelectorAll('[data-c]'),function(td){td.innerHTML=x[td.dataset.c];});
  [].forEach.call(tr.querySelectorAll('[data-m]'),function(d){var q=r[d.dataset.m];d.textContent=(q&&q.laps!=null)?(q.laps*c.track)+'m':'';});});}
function updSel(){var ids=selIds(),l=viewList(),e=$('selN'),b=$('delSel'),k=$('ckAll');
  if(e)e.textContent='✔ '+ids.length+'人選択中';if(b)b.style.opacity=ids.length?'1':'.45';
  if(k)k.checked=l.length>0&&ids.length===l.length;
  [].forEach.call(document.querySelectorAll('tr[data-s]'),function(tr){tr.classList.toggle('sel',!!S.sel[tr.dataset.s]);});}
window.togSel=function(id,on){if(on)S.sel[id]=1;else delete S.sel[id];updSel();};
window.selAll=function(on){S.sel={};if(on)viewList().forEach(function(s){S.sel[s.id]=1;});
  [].forEach.call(document.querySelectorAll('input.ck[data-s]'),function(x){x.checked=!!on;});updSel();};
window.selClear=function(){window.selAll(false);};
function vTeacher(){
  var c=cfg(),cl=DB.classes,list=viewList(),nSel=selIds().length,lab=S.cls||'全クラス';
  function num(k,v,mn,mx,u){return '<div><span class="lbl">'+u+'</span><input type="number" min="'+mn+'" max="'+mx+'" value="'+v+'" style="width:90px" onchange="setS(\''+k+'\',this.value)"></div>';}
  var h='<div style="padding:12px;max-width:1300px;margin:0 auto"><div class="row" style="margin-bottom:10px"><button onclick="go(\'home\')">← 戻る</button><button onclick="tLogout()" style="color:#d93025">ログアウト</button>'+lockBtn()+'<button onclick="xlsxDl()" style="margin-left:auto;background:#1e6b2e;color:#fff;border-color:#1e6b2e;font-weight:600">⬇ Excelでダウンロード（色つき）</button></div>'
  +'<details class="card"'+(S.setOpen?' open':'')+' ontoggle="S.setOpen=this.open"><summary>⚙ 設定（生徒の画面にそのまま反映）</summary><div class="row" style="align-items:flex-end;margin-top:6px">'
  +'<div><span class="lbl">トラック1周</span><select style="width:110px" onchange="setS(\'track\',this.value)"><option value="150"'+(c.track===150?' selected':'')+'>150m（現在の学校）</option><option value="200"'+(c.track===200?' selected':'')+'>200m</option></select></div>'
  +'<div><span class="lbl">評価の厳しさ</span><select style="width:110px" onchange="setLv(this.value)"><option value="easy"'+(c.lv==='easy'?' selected':'')+'>優しい</option><option value="normal"'+(c.lv==='normal'?' selected':'')+'>普通</option><option value="hard"'+(c.lv==='hard'?' selected':'')+'>厳しい</option></select></div>'
  +num('n',c.n,2,12,'全体の回数')+num('min',c.min,1,30,'完走の時間(分)')+num('k',c.k,1,10,'完走点に使う最後の回数')+num('factor',c.factor,50,120,'完走の基準ペース(%)')
  +'<div><span class="lbl">今の授業の回（生徒に表示）</span><select style="width:90px" onchange="setS(\'cur\',this.value)">'+rg(1,c.n).map(function(i){return '<option'+(i===c.cur?' selected':'')+' value="'+i+'">第'+i+'回</option>';}).join('')+'</select></div></div>'
  +'<p style="font-size:11px;color:#888;margin-top:8px;line-height:1.7">第1回と第'+c.n+'回＝タイム測定（男子'+dist('m')+'m・女子'+dist('f')+'m）／その間＝'+c.min+'分完走（1周＝'+c.track+'mごとにボタンで記録。終了時の半周分は「＋半周」で追加）。タイム点：全国平均（令和6年度 体力・運動能力調査）の5段階（平均付近＝3点）。'+(c.lv!=='normal'?'<b>【評価：'+(c.lv==='easy'?'優しい':'厳しい')+'】基準タイムを'+Math.round(Math.abs(LV[c.lv].t-1)*100)+'%'+(c.lv==='easy'?'ゆるく':'きびしく')+'、短縮の秒数を'+Math.round(Math.abs(LV[c.lv].i-1)*100)+'%'+(c.lv==='easy'?'少なく':'多く')+'しています。</b>':'')+(c.track===200?'<b>※200m用は、全国調査に男子2000m・女子1500mが無いため、150m用の全国平均を距離換算（リーゲル式・係数'+RG+'）した推定値です。</b>':'')+'短縮点（10点満点）：'+impTh('m').join('・')+'秒以上短縮＝10〜2点、それ未満＝1点'+(c.track===200?'（女子は'+impTh('f').join('・')+'秒）':'')+'。完走点：全国平均ペア×'+c.factor+'%で'+c.min+'分走った場合の距離を基準に5段階→最後'+c.k+'回の平均。</p></details>'
  +'<details class="card"'+((S.rosOpen||!cl.length)?' open':'')+' ontoggle="S.rosOpen=this.open"><summary>👥 クラス・名簿の追加</summary>'

function buildX(){

  cls.forEach(function(cn){
    var nm=String(cn).replace(/[:\\\/?*\[\]]/g,'_').slice(0,28)||'クラス',k=nm,n=2;while(used[k])k=nm+'_'+(n++);used[k]=1;

    a.href=URL.createObjectURL(b);a.download='持久走記録_'+ds+'.xlsx';document.body.appendChild(a);a.click();a.remove();});

  var none=o.timePt==null&&o.impPt==null&&o.runPt==null;
  h+='<div class="card"><b style="font-size:13px">📊 ここまでの総合評価</b><table style="width:100%;font-size:13px;margin-top:6px"><tr><th>タイム点<br>(5)</th><th>短縮秒</th><th>短縮点<br>(10)</th><th>完走点<br>(5)</th><th>合計<br>(20)</th></tr><tr><td>'+dsh(o.timePt)+'</td><td>'+dsh(o.imp)+'</td><td>'+dsh(o.impPt)+'</td><td>'+dsh(o.runPt)+'</td><td><b>'+(none?'―':o.total)+'</b></td></tr></table></div>';
  return h+critCard(m,tm)+'</div>';}
function vMeasure(){var c=cfg(),r=DB.students[S.run],g=gOf(r),M=S.M,t=typ(S.ses,c.n)==='time',pl=plan(g,c.track),old=(DB.rec[r.id]||{})[S.ses],lock=!!old&&!M.running&&!M.done&&!(old.at&&Date.now()-old.at<290000);
  var h='<div style="max-width:440px;margin:0 auto;padding:1.2rem">'+(M.running?'<p style="font-size:12px;color:#d93025;padding-bottom:14px">⏱ 測定中は戻れません（まちがえてスタートしたときは、下の「リセット」を押してください）</p>':back('← 戻る','pick'))+'<div class="card"><b>第'+S.ses+'回　'+esc(r.cls)+' '+esc(r.number)+'番</b>（'+(g==='f'?'女子':'男子')+'）<div style="font-size:12px;color:#666;margin-top:4px">'
  +(t?dist(g)+'mタイム測定：'+(pl.first===c.track?'ゴールラインからスタート':'<b>ゴールラインの手前'+pl.first+'mからスタート</b>')+'、ゴールラインを通るたびにボタン（全'+pl.n+'回）':c.min+'分間走り、1周ごとにボタン。時間になったら半周以上走っていれば「＋半周」')+'</div></div>';
  if(lock)h+='<div class="card" style="background:#fff3e0;border-color:#f3c98b;font-size:14px;line-height:1.7">🔒 この回は<b>すでに記録があります</b>（'+(t?fmt(old.t):old.laps+'周')+'）。<br>保存から時間がたった記録は、生徒の画面からは変更できません。まちがいは先生に伝えてください。</div>';
  if(!M.running&&!M.done&&!lock)h+='<button class="big bp" onclick="mStart()">▶ スタート</button>';
  h+='<div class="tm" id="tm">'+(M.done?(t?fmt(M.t):c.min+'分終了'):fmt(t?0:c.min*60))+'</div>';
  if(M.running)h+='<button class="big" style="background:#e6f4ea;border-color:#1e6b2e;color:#1e6b2e" onclick="mLap()">🏁 1周</button>';
  h+='<div style="text-align:center;margin:10px 0;font-size:16px">'+(t?'<b>'+M.laps.length+'</b> / '+pl.n+' 回':'<b>'+M.cnt+'</b> 周（'+M.cnt*c.track+'m）')+'</div>';
  h+=liveBox(r,t);
  if(M.running&&M.laps.length)h+='<div style="text-align:center;margin-bottom:8px"><button onclick="mUndo()">↩ 1つ取り消す</button></div>';
  if(!t&&(M.running||M.done))h+='<div class="row" style="justify-content:center"><button onclick="mAdj(-1)">−1周</button><button onclick="mAdj(-.5)">−半周</button><button onclick="mAdj(.5)">＋半周</button><button onclick="mAdj(1)">＋1周</button></div>';
  if(M.running)h+='<div style="text-align:center;margin:16px 0 4px"><button onclick="mReset()" style="color:#d93025;border-color:#d93025">⟲ タイマーをリセット（まちがえてスタートした）</button></div>';
  if(M.laps.length){h+='<div class="card" style="margin-top:12px;padding:8px 12px"><div style="font-size:12px;color:#888;margin-bottom:4px">記録（新しい順）</div>';
    for(var i=M.laps.length-1;i>=0;i--){var sp=M.laps[i]-(i?M.laps[i-1]:0);
      h+='<div style="display:flex;justify-content:space-between;padding:6px 2px;border-top:1px solid #eef1fb;font-size:14px"><b>'+(i+1)+(t?'回目':'周目')+(!t?'（'+(i+1)*c.track+'m）':'')+'</b><span>'+fmt(M.laps[i])+'　<span style="color:#888;font-size:12px">ラップ '+fmt(sp)+'</span></span></div>';}
    h+='</div>';}
  if(M.done)h+='<p style="text-align:center;color:#1e6b2e;font-weight:700;margin:10px 0">✅ 記録を保存しました</p>';
  if(t&&!M.running&&!lock)h+='<div class="card" style="margin-top:12px"><span class="lbl" style="margin-top:0">手入力（まちがえたとき）</span><div class="row"><input id="mt" placeholder="例 6:32.5 または 392" value="'+(M.done?fmt(M.t):'')+'" style="flex:1"><button class="bp" onclick="mManual()">保存</button></div></div>';
  if(!t&&!M.running&&!lock)h+='<div class="card" style="margin-top:12px"><span class="lbl" style="margin-top:0">手入力の周回数（0.5周単位）</span><div class="row"><input id="mt" type="number" step="0.5" placeholder="例 12.5" style="flex:1"><button class="bp" onclick="mManual()">保存</button></div></div>';
  if(old&&!lock)h+='<p style="font-size:12px;color:#888;margin-top:10px">いまの記録：'+(t?fmt(old.t):old.laps+'周')+'（保存すると上書きされます。保存から5分たつと変更できません）</p>';
  return h+critCard(r,t)+'</div>';}
function liveBox(r,t){
  var M=S.M,c=cfg(),g=gOf(r),y=yrOf(r.cls),k=M.laps.length,B=bnd(g,y),tot=dist(g),o,sc,big='font-size:20px;color:#b45309';
  var w='<div class="card" style="margin-top:12px;background:#fffbea;border-color:#f3dc8a;line-height:1.9;font-size:14px">';
  if(t){
    if(M.done&&M.t!=null)return w+'🎉 <b>ゴール！　'+fmt(M.t)+'</b><br>評価：<b style="'+big+'">'+tScore(M.t,y,g)+'点</b>（5点満点）</div>';
    if(!M.running||!k)return '';
    var pl=plan(g,c.track),d=pl.first+(k-1)*c.track,e=M.laps[k-1],proj=e/d*tot,left=tot-d;sc=tScore(proj,y,g);
    o=w+'⏱ 今のペース：<b>1周 '+fmt(e/d*c.track)+'</b>（1000m '+fmtS(Math.round(e/d*1000))+'）<br>残り <b>'+(pl.n-k)+'回</b>（あと'+left+'m）<br>このペースなら <b>'+fmt(proj)+'</b> → 評価 <b style="'+big+'">'+sc+'点</b>';
    if(sc<5){var tg=B[4-sc],rt=tg-e;o+='<br><span style="color:#b45309">🔥 '+(sc+1)+'点まであと約'+Math.max(1,Math.ceil(proj-tg))+'秒！'+(rt>0&&left>0?'残りを1周 '+fmt(rt/left*c.track)+' 以内で走れば届く':'')+'</span>';}
    else o+='<br><span style="color:#1e6b2e">🔥 最高評価のペース！この調子！</span>';
    return o+'</div>';}
  if(M.done)return w+'🏁 <b>'+c.min+'分完走！　'+M.cnt+'周 ＝ '+Math.round(M.cnt*c.track)+'m</b><br>評価：<b style="'+big+'">'+rScore(M.cnt*c.track,y,g,c)+'点</b>（5点満点）</div>';
  if(!M.running||!k||!M.cnt)return '';
  var e2=M.laps[k-1],dn=M.cnt*c.track,pj=dn/e2*c.min*60,th=B.map(function(x){return Math.round(dist(g)/x*c.min*60*c.factor/100/10)*10;});sc=rScore(pj,y,g,c);
  o=w+'⏱ 今のペース：<b>1周 '+fmt(e2/M.cnt)+'</b>（1000m '+fmtS(Math.round(e2/dn*1000))+'）<br>いま <b>'+M.cnt+'周 ＝ '+dn+'m</b><br>このペースで走り切ると <b>約'+(Math.round(pj/c.track*10)/10)+'周 ＝ 約'+Math.round(pj/10)*10+'m</b> → 評価 <b style="'+big+'">'+sc+'点</b>';
  if(sc<5)o+='<br><span style="color:#b45309">🔥 '+(sc+1)+'点は '+th[4-sc]+'m ―あと約'+Math.max(10,th[4-sc]-Math.round(pj/10)*10)+'m分ペースアップ！</span>';
  else o+='<br><span style="color:#1e6b2e">🔥 最高評価のペース！この調子！</span>';
  return o+'</div>';}
function fmtS(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function critCard(r,t){var c=cfg(),y=yrOf(r.cls),k=['m','f'],o='<div class="card" style="margin-top:12px"><b style="font-size:13px">📊 評価基準（中'+y+'・全国平均をもとにした5段階'+(c.track===200?'・200mは距離換算の推定':'')+lvTxt()+'）</b><div style="font-size:11px;color:#888;margin:2px 0 6px">'+(t?'タイム測定：男子'+dist('m')+'m／女子'+dist('f')+'m':c.min+'分完走：走った距離（トラック'+c.track+'m）')+'</div><table style="width:100%;font-size:13px"><tr><th>点</th><th>男子</th><th>女子</th></tr>';
  for(var i=0;i<5;i++){o+='<tr><td><b>'+(5-i)+'点</b></td>';k.forEach(function(g){var b=bnd(g,y),s;
    if(t)s=i===0?'〜'+fmtS(b[0]):i<4?fmtS(b[i-1]+1)+'〜'+fmtS(b[i]):fmtS(b[3]+1)+'〜';
    else{var d=b.map(function(x){return Math.round(dist(g)/x*c.min*60*c.factor/100/10)*10;});s=i<4?d[i]+'m以上':d[3]+'m未満';}
    o+='<td>'+s+'</td>';});o+='</tr>';}
  return o+'</table></div>';}
function tick(){var M=S.M,c=cfg();if(!M||!M.running)return;var e=(Date.now()-M.t0)/1000,t=typ(S.ses,c.n)==='time',el=$('tm');
  if(t){if(el)el.textContent=fmt(e);}else{var rem=c.min*60-e;if(rem<=0){finRun();return;}if(el)el.textContent=fmt(rem);}}
function persist(){try{var M=S.M;localStorage.setItem('kyuso_m',JSON.stringify({me:S.me.id,run:S.run,ses:S.ses,t0:M.t0,laps:M.laps,cnt:M.cnt}));}catch(e){}}
function stop(){var M=S.M;clearInterval(M.iv);M.running=false;M.done=true;try{localStorage.removeItem('kyuso_m');}catch(e){}try{if(S.wl)S.wl.release();}catch(e){}S.wl=null;}
function wake(){try{navigator.wakeLock.request('screen').then(function(l){S.wl=l;}).catch(function(){});}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.M&&S.M.running){tick();wake();}});
window.onbeforeunload=function(e){if(S.M&&S.M.running){e.preventDefault();e.returnValue='';return '';}};
var restored=false;
function tryRestore(){try{var d=JSON.parse(localStorage.getItem('kyuso_m')||'null');if(!d||Date.now()-d.t0>3*3600*1000||!DB.students[d.me]||!DB.students[d.run]){localStorage.removeItem('kyuso_m');return;}
  S.me=DB.students[d.me];S.run=d.run;S.ses=d.ses;S.M={running:true,done:false,laps:d.laps||[],cnt:d.cnt||0,t0:d.t0,iv:setInterval(tick,100)};S.page='measure';wake();}catch(e){}}
function save(v){set('rec/'+S.run+'/'+S.ses,Object.assign(v,{by:S.me.id,at:TS}));}
function finRun(){stop();save({laps:S.M.cnt,lp:S.M.laps});render();}
window.mStart=function(){var M=S.M;M.running=true;M.t0=Date.now();M.laps=[];M.cnt=0;M.iv=setInterval(tick,100);persist();wake();render();};
window.mLap=function(){var M=S.M,c=cfg(),e=(Date.now()-M.t0)/1000;
  if(typ(S.ses,c.n)==='time'){M.laps.push(e);if(M.laps.length>=plan(gOf(DB.students[S.run]),c.track).n){M.t=r1(e);stop();save({t:M.t,lp:M.laps});}}
  else{M.laps.push(e);M.cnt+=1;}if(S.M.running)persist();render();};
window.mUndo=function(){var M=S.M;M.laps.pop();if(typ(S.ses,cfg().n)!=='time')M.cnt=Math.max(0,M.cnt-1);if(M.running)persist();render();};
window.mReset=function(){uiConfirm('タイマーをリセットしますか？\n\n今の測定（タイム・周回数）はすべて消えて、記録は保存されません。\n（スタート前の状態に戻ります）',function(){
  var M=S.M;clearInterval(M.iv);try{localStorage.removeItem('kyuso_m');}catch(e){}try{if(S.wl)S.wl.release();}catch(e){}S.wl=null;
  S.M={running:false,done:false,laps:[],cnt:0,t0:0,iv:null,raw:''};});};
window.mAdj=function(d){var M=S.M;M.cnt=Math.max(0,M.cnt+d);if(M.done)save({laps:M.cnt,lp:M.laps});else if(M.running)persist();render();};
window.mManual=function(){var c=cfg(),v=$('mt').value,M=S.M;
  if(typ(S.ses,c.n)==='time'){var x=parseT(v);if(!x||isNaN(x)){uiAlert('「6:32.5」や「392」のように入力してください');return;}M.t=x;M.done=true;save({t:x});}
  else{var l=+v;if(v===''||!isFinite(l)||l<0||(l*2)%1){uiAlert('0.5周単位の数字で入力してください');return;}M.cnt=l;M.done=true;save({laps:l});}
  render();};
// ── 同期 ──
db.ref('kyuso1').on('value',function(snap){var v=snap.val()||{};DB.classes=v.classes||[];DB.students=v.students||{};DB.rec=v.rec||{};DB.settings=v.settings||{};
  $('sync').textContent='✅ リアルタイム同期中';$('sync').className='ok';if(!restored){restored=true;tryRestore();}
  if(S.page==='measure'&&S.M&&S.M.running)return;
  var a=document.activeElement;
  if(S.page==='teacher'&&(Date.now()-S.hold<500||(a&&a.tagName==='INPUT'&&a.id!=='nc'))){refreshCalc();return;}
  render();},function(e){$('sync').textContent='❌ 接続エラー: '+e.message;$('sync').className='err';});
auth.onAuthStateChanged(function(u){teacher=!!u;if(!u&&S.page==='teacher')S.page='home';render();});
$('app').addEventListener('keydown',function(e){var t=e.target;
  if(!t||!t.classList||!t.classList.contains('in')||e.isComposing||e.keyCode===229)return;
  var k=e.key;if(k!=='Enter'&&k!=='ArrowDown'&&k!=='ArrowUp')return;e.preventDefault();
  var d=(k==='ArrowUp'||(k==='Enter'&&e.shiftKey))?-1:1,col=[].slice.call(document.querySelectorAll('#app input.in[data-i="'+t.dataset.i+'"]')),j=col.indexOf(t)+d;
  if(j>=0&&j<col.length){col[j].focus();col[j].select();}else t.blur();});
render();}
</script></body></html>
