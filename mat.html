body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f0f4ff;color:#222;font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 14px;font-size:14px;transition:all .15s}

.bc{background:#fef7e0;color:#8a6000}.bd{background:#fce8e6;color:#a50e0e}

.cat-接転{background:#e8f0fe;color:#1a56c4;border:1px solid #c5d8fd}
.cat-ほん転{background:#fce8f3;color:#8b1e6b;border:1px solid #f5c0e4}
.cat-平均{background:#e6f4ea;color:#1e6b2e;border:1px solid #b8e0c2}
.cat-label{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;display:inline-block;margin-bottom:6px}

.skill-header:hover{background:#f5f8ff}
.skill-detail{border-top:1px solid #dde4f8;padding:12px 13px;background:#fafbff}
.grade-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:6px;text-align:left;width:100%;transition:all .15s}
.grade-btn:hover{opacity:.85}
.grade-btn.active{outline:2.5px solid #4A86E8;outline-offset:1px}
.grade-btn-a{background:#e6f4ea;border-color:#b8e0c2;color:#1e6b2e}
.grade-btn-b{background:#e8f0fe;border-color:#c5d8fd;color:#1a56c4}
.grade-btn-c{background:#fef7e0;border-color:#f9e0a0;color:#8a6000}
.grade-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.gi-a{background:#b8e0c2;color:#1e6b2e}
.gi-b{background:#c5d8fd;color:#1a56c4}
.gi-c{background:#f9e0a0;color:#8a6000}

.grade-circle{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.stu-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.stu-card:hover{background:#f0f4ff;border-color:#c5d8fd}
.stu-card.active{background:#e8f0fe;border-color:#4A86E8}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.cls-tag{display:flex;align-items:center;gap:4px;padding:4px 10px;background:#e8f0fe;border:1px solid #c5d8fd;border-radius:20px;font-size:13px}
#syncBar{background:#fff8e1;border-bottom:1px solid #ffe082;padding:6px 14px;font-size:12px;color:#8a6d00;text-align:center}
#syncBar.ok{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}

  function gcStyle(g){if(g==="A"||g==="A+")return"background:#e6f4ea;color:#1e6b2e";if(g==="B"||g==="B+")return"background:#e8f0fe;color:#1a56c4";if(g==="C")return"background:#fef7e0;color:#8a6000";return"background:#fce8e6;color:#a50e0e";}
  function calcTotal(sc,skills){
    var base=skills.reduce(function(s,sk){return s+(sc[sk.id]?sc[sk.id].pts:0);},0);
    var done=skills.filter(function(sk){return sc[sk.id];}).length;
    var bonus=(skills.length>0&&done===skills.length)?4:0;
    return base+bonus;
  }
  var DEFAULT_THRESH={1:[["A",42],["B",31],["C",20]],23:[["A+",74],["A",66],["B+",55],["B",44]]};
  var BOTTOM_GRADE={1:"D",23:"C"};
  function threshKey(yr){return yr===1?1:23;}
  function getThresh(yr){
    var key=threshKey(yr);
    var base=DEFAULT_THRESH[key];
    var ov=DB.thresholds&&DB.thresholds[key];
    if(!ov)return base;
    return base.map(function(pair){
      var v=ov[pair[0]];
      return [pair[0],(v!==undefined&&v!==null&&v!=="")?Number(v):pair[1]];
    });
  }
  function calcGrade(t,yr){
    var th=getThresh(yr);
    for(var i=0;i<th.length;i++){if(t>=th[i][1])return th[i][0];}
    return BOTTOM_GRADE[threshKey(yr)];
  }
  function uniq(arr){var s={},r=[];arr.forEach(function(v){if(!s[v]){s[v]=1;r.push(v);}});return r;}
  function escapeHtml(str){return String(str==null?"":str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function catKey(cat){if(cat.indexOf("接転")>=0)return"接転";if(cat.indexOf("ほん転")>=0)return"ほん転";return"平均";}
  function gradeFromCls(cls){
    // 「1年」「1-」「１年」「１-」いずれでも1年と判断
    if(cls.match(/^1[年\-－]/)||cls.match(/^１[年\-－]/)||cls.indexOf("1年")>=0||cls.indexOf("１年")>=0)return 1;
    if(cls.match(/^2[年\-－]/)||cls.match(/^２[年\-－]/)||cls.indexOf("2年")>=0||cls.indexOf("２年")>=0)return 2;
    if(cls.match(/^3[年\-－]/)||cls.match(/^３[年\-－]/)||cls.indexOf("3年")>=0||cls.indexOf("３年")>=0)return 3;
    return 1; // デフォルト1年
  }

  window.openEditThreshold=function(yr){S.editThreshold=yr;render();};
  window.closeEditThreshold=function(){S.editThreshold=null;render();};
  window.saveEditThreshold=function(yr){
    var key=threshKey(yr);
    var base=DEFAULT_THRESH[key];
    var newOv={},ok=true,prev=null;
    for(var i=0;i<base.length;i++){
      var label=base[i][0];
      var el=document.getElementById('et_'+label);
      var v=el?el.value.trim():'';
      if(v===""||isNaN(Number(v))){ok=false;break;}
      var num=Number(v);
      if(prev!==null&&num>=prev){ok=false;break;} // 上位グレードより小さい値でなければならない
      newOv[label]=num;
      prev=num;
    }
    if(!ok){showAlert("点数を正しく入力してください（上のグレードほど高い点数にしてください）");return;}
    dbSet('thresholds/'+key,newOv,function(){
      DB.thresholds[key]=newOv;
      S.editThreshold=null;render({keepScroll:true});
    });
  };
  window.resetEditThreshold=function(yr){

  function renderGradeCriteria(yr,isTeacher){
    var th=getThresh(yr);
    var bottom=BOTTOM_GRADE[threshKey(yr)];
    var items=th.map(function(pair,i){
      var label=pair[0],min=pair[1];
      var text=i===0?(min+"点以上"):(min+"〜"+(th[i-1][1]-1)+"点");
      return [label,text];
    });
    items.push([bottom,(th[th.length-1][1]-1)+"点以下"]);
    var sklCount=SKILLS[yr]?SKILLS[yr].length:14;
    var editBtn=isTeacher?'<button onclick="openEditThreshold('+yr+')" style="font-size:11px;color:#4A86E8;border-color:#c5d8fd;background:#eef4ff;padding:4px 10px;margin-bottom:8px">✏️ 評価基準（点数）を編集</button>':'';
    return '<div style="background:#fff;border:1px solid #dde4f8;border-radius:10px;padding:12px 14px;margin-top:8px">'
      +editBtn
      +'<p style="font-size:12px;color:#888;margin-bottom:4px">評価基準（'+sklCount+'種目 '+BASE_MAX[yr]+'点満点＋全種目完了で+4点）</p>'
      +'<p style="font-size:11px;color:#aaa;margin-bottom:8px">全'+sklCount+'種目すべてに得点が入ると、合計に自動で+4点されます（最大'+(BASE_MAX[yr]+4)+'点）</p>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'
      +items.map(function(r){return'<span class="badge b'+gradeOf(r[0])+'"><b>'+r[0]+'</b> '+r[1]+'</span>';}).join('')
      +'</div></div>';
  }

    det.style.display=open?"none":"block";S.tExpanded=open?null:id;
    var row=document.getElementById("trow-"+id);
    if(row){var sp=row.querySelectorAll(".skill-header span");var last=sp[sp.length-1];if(last)last.textContent=open?'▼':'▲';}
  };
  window.toggleExpS=function(id){
    var det=document.getElementById("sdetail-"+id);if(!det)return;
    var open=det.style.display!=="none";
    if(S.stuExpanded&&S.stuExpanded!==id){var o=document.getElementById("sdetail-"+S.stuExpanded);if(o)o.style.display="none";}
    det.style.display=open?"none":"block";S.stuExpanded=open?null:id;
    var row=document.getElementById("srow-"+id);
    if(row){var sp=row.querySelectorAll(".skill-header span");var last=sp[sp.length-1];if(last)last.textContent=open?'▼':'▲';}
  };

  window.doScoreT=function(skillId,grade,pts){
    S.tScores[skillId]={grade:grade,pts:pts};
    dbSet('scores/'+S.selId+'/'+skillId,{grade:grade,pts:pts});
    render({keepScroll:true});
  };
  window.doResetScoreT=function(skillId){
    showConfirm("未評価に戻しますか？",'resetScoreT',skillId);
  };
  window.doScoreS=function(skillId,grade,pts){
    S.stuScores[skillId]={grade:grade,pts:pts};
    dbSet('scores/'+S.logStu.id+'/'+skillId,{grade:grade,pts:pts});
    render({keepScroll:true});
  };
  window.doResetScoreS=function(skillId){
    showConfirm("未入力に戻しますか？",'resetScoreS',skillId);
  };

  window.doAddStu=function(){
    var num=document.getElementById("nNum").value.trim();
    var cls=document.getElementById("nCls").value;
    if(!num){showAlert("出席番号を入力してください");return;}
    var id=genId();
    dbSet('students/'+id,{id:id,number:num,cls:cls,grade:gradeFromCls(cls),password:num,isDefault:true},function(){S.addOpen=false;render();});
  };
  window.genBulkSeq=function(){
    var n=parseInt(document.getElementById("bCount").value,10);
    if(!n||n<1){showAlert("人数を入力してください");return;}
    var start=parseInt(document.getElementById("bStart").value)||1;
    var seq=[];for(var i=0;i<n;i++)seq.push(String(start+i));
    document.getElementById("bNames").value=seq.join("\n");
  };
  window.doBulkAdd=function(){
    var cls=document.getElementById("bCls").value;
    var lines=document.getElementById("bNames").value.split("\n").map(function(n){return n.trim();}).filter(function(n){return n;});
    if(!lines.length){showAlert("出席番号を入力してください");return;}
    var count=0,total=lines.length;
    lines.forEach(function(line){
      var m=line.match(/\d+/);
      var num=m?m[0]:line;var id=genId();
      dbSet('students/'+id,{id:id,number:num,cls:cls,grade:gradeFromCls(cls),password:num,isDefault:true},function(){
        count++;if(count===total){S.bulkOpen=false;showAlert(count+"人を追加しました！");render();}
      });
    });
  };
  window.doDelStu=function(id){dbRemove('students/'+id);dbRemove('scores/'+id);if(S.selId===id){S.selId=null;S.tScores={};}S.delConf=null;render();};
  window.addClassItem=function(){var v=document.getElementById("newCls").value.trim();if(!v)return;if(DB.classes.indexOf(v)>=0){showAlert("すでに存在するクラスです");return;}dbSet('classes',DB.classes.concat([v]));};
  window.delClass=function(cls){showConfirm("「"+cls+"」を削除しますか？",'delClass',cls);};
  window.doChangePw=function(){
    var o=document.getElementById("pwOld").value,n=document.getElementById("pwNew").value,n2=document.getElementById("pwNew2").value;
    if(n!==n2){S.pwErr="新しいパスワードが一致しません";render();return;}
    if(n.length<4){S.pwErr="4文字以上にしてください";render();return;}
    if(S.logStu.password!==o){S.pwErr="現在のパスワードが違います";render();return;}
    dbSet('students/'+S.logStu.id+'/password',n);
    dbSet('students/'+S.logStu.id+'/isDefault',false,function(){S.logStu=Object.assign({},S.logStu,{password:n,isDefault:false});S.pwOk=true;render();});
  };
  window.doResetAll=function(){
    dbRemove('students');dbRemove('scores');S.selId=null;S.tScores={};S.resetModal=false;S.resetErr="";showAlert("✅ 全データを削除しました。");render();
  };
  window.downloadCSV=function(){
    var students=getStudents();
    var classesToExport=S.rankingFilterCls==="all"?uniq(students.map(function(s){return s.cls;})):[S.rankingFilterCls];
    var sampleSkills=SKILLS[1];
    var headers=["クラス","出席番号"];
    sampleSkills.forEach(function(sk,i){headers.push((i+1)+"."+sk.name);});
    headers.push("合計点","評価");
    var rows=[headers];
    classesToExport.forEach(function(cls){
      // 出席番号順に並べ、欠席などで登録・記録が無い番号は空欄の行にして「飛び」を可視化する
      var clsStudents=students.filter(function(s){return s.cls===cls;});
      var byNum={};
      var maxNum=0;
      clsStudents.forEach(function(s){
        var n=parseInt(s.number,10)||0;
        byNum[n]=s;
        if(n>maxNum)maxNum=n;
      });
      for(var n=1;n<=maxNum;n++){
        var s=byNum[n];
        if(s){
          var sc=DB.scores[s.id]||{};
          var skills=SKILLS[gradeFromCls(s.cls)];
          var total=calcTotal(sc,skills);
          var grade=calcGrade(total,s.grade);
          var row=[s.cls,s.number];
          skills.forEach(function(sk){var cur=sc[sk.id];row.push(cur?cur.grade:"");});
          row.push(total,grade);rows.push(row);
        }else{
          var blankRow=[cls,String(n)];
          sampleSkills.forEach(function(){blankRow.push("");});
          blankRow.push("","");
          rows.push(blankRow);
        }
      }
    });
    var csv="\uFEFF"+rows.map(function(row){
      return row.map(function(cell){var s=String(cell==null?"":cell);if(s.indexOf(",")>=0||s.indexOf('"')>=0){s='"'+s.replace(/"/g,'""')+'"';}return s;}).join(",");
    }).join("\n");
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download="マット運動評価_"+(S.rankingFilterCls==="all"?"全クラス":S.rankingFilterCls)+".csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  // Firebase監視
  db.ref('mat1').on('value',function(snap){
    var val=snap.val()||{};
    DB.classes=val.classes||[];DB.students=val.students||{};DB.scores=val.scores||{};DB.criteria=val.criteria||{};DB.thresholds=val.thresholds||{};
    if(S.selId&&DB.scores[S.selId])S.tScores=DB.scores[S.selId];
    syncBar('ok','✅ リアルタイム同期中');
    if(S.page==='teacher'||S.page==='stuview')render({keepScroll:true});
    else render();
  },function(err){syncBar('err','❌ 接続エラー: '+err.message);render();});

  auth.onAuthStateChanged(function(user){
    teacherUnlocked=!!user;
    if(!user && S.page==='teacher'){S.page='home';}
    render();
  });

  render();
}
</script>
